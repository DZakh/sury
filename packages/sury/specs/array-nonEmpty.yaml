# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.array(S.string).with(S.nonEmpty)
  input: "[string, ...string[]]"
  output: "[string, ...string[]]"
  instantiations: 870
jsonSchema:
  input: '{ items: { type: "string" }, type: "array", minItems: 1 }'
  fromInputType: string[]
  output: '{ items: { type: "string" }, type: "array", minItems: 1 }'
  fromOutputType: string[]
isEqual: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
compare: "throws: [Sury] Can't compare string[].length >= 1. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    schema: z.array(z.string()).min(1)
    divergence: "`S.nonEmpty` on an array admits `[string, ...string[]]` in the Sury type - indexing `[0]` needs no cast - where Zod keeps the unbounded `string[]`."
    input: string[]
    output: string[]
operations:
  parse:
    expression: i=>{try{Array.isArray(i)||e[2](i);for(let v0=0;v0<i.length;++v0){let v1=i[v0];typeof v1==="string"||e[0](v1,[v0]);}i.length>0||e[1](i);return i}catch(v2){e[3](v2)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      longer:
        input: '["a", "b", "c"]'
        output: '["a", "b", "c"]'
      shorter:
        input: '["a"]'
        output: '["a"]'
      empty:
        input: "[]"
        error: Expected string[].length >= 1, received []
      wrong-type:
        input: '"ab"'
        error: Expected string[].length >= 1, received "ab"
  decode:
    expression: i=>{try{i.length>0||e[0](i);return i}catch(v1){e[1](v1)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      shorter:
        input: '["a"]'
        output: '["a"]'
      empty:
        input: "[]"
        error: Expected string[].length >= 1, received []
  encode:
    expression: i=>{try{i.length>0||e[0](i);return i}catch(v1){e[1](v1)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      shorter:
        input: '["a"]'
        output: '["a"]'
      empty:
        input: "[]"
        error: Expected string[].length >= 1, received []
