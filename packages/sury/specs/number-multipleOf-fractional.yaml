          reason: multipleOf divides exactly, and the IEEE-754 remainder S.multipleOf takes is not zero for these
          ajv: "input: data must be multiple of 0.1; output: data must be multiple of 0.1"
      valid-negative:
        input: "-0.7"
        output: "-0.7"
        divergence:
