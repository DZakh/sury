    input: '{ anyOf: [{ type: "object", properties: { t: { enum: [null] }, x: { type: "string" } }, additionalProperties: false, required: ["t", "x"] }, { type: "object", properties: { t: { type: "string", enum: ["b"] } }, additionalProperties: false, required: ["t"] }] }'
