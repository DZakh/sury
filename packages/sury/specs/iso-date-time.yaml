      leap-second:
        input: '"2016-12-31T23:59:60Z"'
        output: '"2016-12-31T23:59:60Z"'
      leap-second-under-offset:
        input: '"1998-12-31T15:59:60.123-08:00"'
        output: '"1998-12-31T15:59:60.123-08:00"'
      leap-second-off-the-utc-boundary:
        input: '"2016-12-31T23:59:60+01:00"'
        error: Expected date-time, received "2016-12-31T23:59:60+01:00"
      no-zone:
        input: '"2020-01-01T00:00:00"'
