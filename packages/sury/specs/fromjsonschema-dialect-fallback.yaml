# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ "$schema": "http://json-schema.org/draft-04/schema#", "$ref": "#/definitions/value", minLength: 3, definitions: { value: { type: "string" } } })'
  input: string
  output: string
  instantiations: 809
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      ignored-sibling:
        input: '"a"'
        output: '"a"'
      wrong-type:
        input: "1"
        error: Expected string, received 1
  decode: identity
  encode: identity
