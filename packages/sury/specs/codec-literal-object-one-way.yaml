# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.schema("x").with(S.to, S.schema({ a: S.number }))'
  input: '"x"'
  output: "{ a: number; }"
  instantiations: 5547
jsonSchema:
  input: '{ type: "string", const: "x" }'
  output: '{ type: "object", properties: { a: { type: "number" } }, required: ["a"] }'
  openapi-3.0:
    input: '{ type: "string", enum: ["x"] }'
isEqual:
  input: alwaysEqual
  output: (a,b)=>a===b||a.a===b.a
compare:
  input: alwaysCompare
  output: "throws: [Sury] Can't compare { a: number; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    creationError: "SuryError: Can't decode \"x\" -> { a: number; }. Define custom codec with S.to"
  decode: eq-to-parse
  encode:
    # FIXME: no conversion reads an object out of a constant, so decode refuses,
    # yet encode compiles into a check no object can pass. It should refuse too.
    expression: i=>{try{i==="x"||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      no-object-is-the-constant:
        input: "{ a: 1 }"
        error: 'Expected "x", received { a: 1; }'
