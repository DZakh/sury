# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.union([S.string.with(S.to, S.number), S.string]))
  input: string
  output: string | number
  instantiations: 6268
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);for(;;){let r;try{let v0=+i;!Number.isNaN(v0)||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break;}return i}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      float:
        input: '"1.5"'
        output: "1.5"
  decode:
    expression: i=>{for(;;){let r;try{let v0=+i;!Number.isNaN(v0)||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break;}return i}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      # FIXME: `+i` decodes blank strings to 0 — "" and "   " should fall back to
      # the S.string member, as "abc" does, not become a number.
      empty-string:
        input: '""'
        output: "0"
      whitespace-string:
        input: '"   "'
        output: "0"
      hex-string:
        input: '"0x10"'
        output: "16"
      infinity-string:
        input: '"Infinity"'
        output: Infinity
  encode:
    expression: i=>{for(;;){if(typeof i==="number"&&!Number.isNaN(i)){i=""+i;break}if(typeof i==="string")break;e[0](i)}return i}
    examples:
      number:
        input: "123"
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
