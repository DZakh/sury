# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.union([S.string.with(S.to, S.number), S.string]))
  input: string
  output: string | number
  instantiations: 5597
jsonSchema:
  input: '{ type: "string" }'
  output: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);for(;;){let r;try{let v0=+i;v0===v0&&(v0||i.trim())||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break;}return i}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      float:
        input: '"1.5"'
        output: "1.5"
  decode:
    expression: i=>{for(;;){let r;try{let v0=+i;v0===v0&&(v0||i.trim())||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break;}return i}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      empty-string:
        input: '""'
        output: '""'
      whitespace-string:
        input: '"   "'
        output: '"   "'
      hex-string:
        input: '"0x10"'
        output: "16"
      infinity-string:
        input: '"Infinity"'
        output: Infinity
  encode:
    expression: i=>{for(;;){if(typeof i==="number"&&i===i){i=""+i;break}if(typeof i==="string")break;e[0](i)}return i}
    examples:
      number:
        input: "123"
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
