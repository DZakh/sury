# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.union([S.string.with(S.to, S.number), S.string]))
  input: string
  output: string | number
  instantiations: 6261
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);try{let v0=+i;!Number.isNaN(v0)||e[0](i);i=v0}catch(e0){}return i}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      float:
        input: '"1.5"'
        output: "1.5"
  decode:
    expression: i=>{try{let v0=+i;!Number.isNaN(v0)||e[0](i);i=v0}catch(e0){}return i}
    examples: {}
  encode:
    expression: i=>{if(typeof i==="number"&&!Number.isNaN(i)){i=""+i}else if(!(typeof i==="string")){e[0](i)}return i}
    examples:
      number:
        input: "123"
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
