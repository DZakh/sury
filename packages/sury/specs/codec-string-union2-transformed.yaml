    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[2](i);for(;;){let r;try{let v0=+i;v0==v0&&(v0||i.trim())||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break;}return i}catch(v1){e[3](v1)}}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      float:
        input: '"1.5"'
        output: "1.5"
  decode:
    expression: i=>{try{for(;;){let r;try{let v0=+i;v0==v0&&(v0||i.trim())||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break;}return i}catch(v1){e[2](v1)}}
    examples:
      decodes-to-number:
        input: '"123"'
        output: "123"
      falls-back-to-string:
        input: '"abc"'
        output: '"abc"'
      empty-string:
        input: '""'
        output: '""'
      whitespace-string:
        input: '"   "'
        output: '"   "'
