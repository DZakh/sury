# yaml-language-server: $schema=./spec.schema.json
# FIXME: the length side drops a re-applied bound's message the same way
# number-gte-redundant does, and just as silently — see the FIXME there.
ts:
  schema: S.string.with(S.length, 2).with(S.length, 2, "MY MESSAGE")
  input: string
  output: string
  instantiations: 5361
vs:
  zod: z.string().length(2).length(2, "MY MESSAGE")
jsonSchema:
  input: '{ type: "string", minLength: 2, maxLength: 2 }'
  output: '{ type: "string", minLength: 2, maxLength: 2 }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);i.length===2||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      too-short:
        input: '"a"'
        error: MY MESSAGE
      too-long:
        input: '"abc"'
        error: MY MESSAGE
      empty:
        input: '""'
        error: MY MESSAGE
  decode:
    expression: i=>{i.length===2||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      too-long:
        input: '"abc"'
        error: MY MESSAGE
  encode:
    expression: i=>{i.length===2||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      too-long:
        input: '"abc"'
        error: MY MESSAGE
