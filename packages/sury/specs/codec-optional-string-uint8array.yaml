# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.optional(S.string).with(S.to, S.uint8Array)
  input: string | undefined
  output: Uint8Array<ArrayBufferLike>
  instantiations: 4587
jsonSchema:
  input: '{ type: "string" }'
  fromInputType: string
  output: Expected JSON, received Uint8Array
isEqual:
  input: strictEqual
  output: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
compare:
  input: (a,b)=>a===b?0:(a===void 0?b===void 0?0:-1:b===void 0?1:a<b?-1:a>b?1:0)
  output: "throws: [Sury] Can't compare Uint8Array. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{if(typeof i==="string"){i=e[0](i)}else{throw e[1](i)}return i}catch(v0){e[2](v0)}}
    examples:
      text:
        input: '"hi"'
        output: new Uint8Array([104, 105])
      undefined-is-rejected:
        input: undefined
        error: Expected string, received undefined
  decode: eq-to-parse
  encode:
    expression: i=>{try{let v0=e[0].decode(i);i=v0;return i}catch(v1){e[1](v1)}}
    examples:
      bytes-back:
        input: new Uint8Array([104, 105])
        output: '"hi"'
