# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ nullable: true, type: "string", enum: ["a", "b"] })'
  input: '"a" | "b" | null'
  output: '"a" | "b" | null'
  instantiations: 564
jsonSchema:
  input: '{ enum: ["a", "b", null] }'
  output: '{ enum: ["a", "b", null] }'
isEqual: strictEqual
compare: "throws: [Sury] Can't compare \"a\" | \"b\" | null. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod: z.enum(["a", "b"]).nullable()
operations:
  parse:
    expression: i=>{(typeof i==="string"&&(i==="a"||i==="b")||i===null)||e[0](i);return i}
    examples:
      literal-member:
        input: '"a"'
        output: '"a"'
      other-literal-member:
        input: '"b"'
        output: '"b"'
      null-stays-a-member:
        input: "null"
        output: "null"
      outside-the-enum:
        input: '"c"'
