# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.base64.with(S.to, S.uint8Array)
  input: string
  output: Uint8Array<ArrayBufferLike>
  instantiations: 4419
jsonSchema:
  input: '{ type: "string", contentEncoding: "base64" }'
  output: Expected JSON, received Uint8Array
  openapi-3.0:
    input: '{ type: "string", format: "byte" }'
isEqual:
  input: strictEqual
  output: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
compare:
  input: strictCompare
  output: "throws: [Sury] Can't compare Uint8Array. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[3](i);e[1](i)||e[2](i);return e[0](i)}catch(v0){e[4](v0)}}
    examples:
      non-utf8-bytes:
        input: '"iVBORw=="'
        output: new Uint8Array([137, 80, 78, 71])
      empty:
        input: '""'
        output: new Uint8Array([])
      one-byte:
        input: '"/w=="'
        output: new Uint8Array([255])
      not-base64:
        input: '"!!"'
        error: Expected base64, received "!!"
      not-a-string:
        input: "3"
        error: Expected base64, received 3
  decode:
    expression: i=>{try{e[1](i)||e[2](i);return e[0](i)}catch(v0){e[3](v0)}}
    examples:
      non-utf8-bytes:
        input: '"iVBORw=="'
        output: new Uint8Array([137, 80, 78, 71])
  encode:
    expression: i=>{try{return e[0](i)}catch(v0){e[1](v0)}}
    examples:
      non-utf8-bytes:
        input: new Uint8Array([137, 80, 78, 71])
        output: '"iVBORw=="'
      empty:
        input: new Uint8Array([])
        output: '""'
