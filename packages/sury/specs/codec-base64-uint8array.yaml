# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.base64.with(S.to, S.uint8Array)
  input: string
  output: Uint8Array<ArrayBufferLike>
  instantiations: 5091
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string", contentEncoding: "base64", pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$" }'
  output: Expected JSON, received Uint8Array
operations:
  parse:
    expression: i=>{typeof i==="string"||e[3](i);e[1].test(i)||e[2](i);return e[0](i)}
    examples:
      unpadded-rejected-before-decoding:
        input: '"SGVsbG8"'
        error: Expected base64, received "SGVsbG8"
      whitespace-rejected-before-decoding:
        input: '"SGVs bG8="'
        error: Expected base64, received "SGVs bG8="
      url-alphabet-rejected-before-decoding:
        input: '"SG-k_w=="'
        error: Expected base64, received "SG-k_w=="
      not-a-string:
        input: "42"
        error: Expected base64, received 42
  decode:
    expression: i=>{e[1].test(i)||e[2](i);return e[0](i)}
    examples:
      unpadded-rejected-before-decoding:
        input: '"SGVsbG8"'
        error: Expected base64, received "SGVsbG8"
  encode:
    expression: i=>{return e[0](i)}
    examples:
      valid:
        input: new Uint8Array([72, 101, 108, 108, 111])
        output: '"SGVsbG8="'
      empty:
        input: new Uint8Array([])
        output: '""'
      one-byte-pads-twice:
        input: new Uint8Array([72])
        output: '"SA=="'
      two-bytes-pad-once:
        input: new Uint8Array([72, 101])
        output: '"SGU="'
      high-bytes:
        input: new Uint8Array([255, 254, 253])
        output: '"//79"'
