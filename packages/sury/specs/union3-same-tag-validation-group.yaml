# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.string.with(S.min, 4), S.string.with(S.max, 1), S.string.with(S.length, 2)])
  input: string
  output: string
  instantiations: 6010
vs:
  zod: z.union([z.string().min(4), z.string().max(1), z.string().length(2)])
jsonSchema:
  input: '{ anyOf: [{ type: "string", minLength: 4 }, { type: "string", maxLength: 1 }, { type: "string", minLength: 2, maxLength: 2 }] }'
  output: '{ anyOf: [{ type: "string", minLength: 4 }, { type: "string", maxLength: 1 }, { type: "string", minLength: 2, maxLength: 2 }] }'
operations:
  parse:
    expression: i=>{if(typeof i==="string"){for(;;){let r;try{i.length>3||e[0](i);break}catch(x){(r||(r=[])).push(e[3](x))}try{i.length<2||e[1](i);break}catch(x){(r||(r=[])).push(e[3](x))}try{i.length===2||e[2](i);break}catch(x){(r||(r=[])).push(e[3](x))}e[4](i,...(r||[]))}}else{e[5](i)}return i}
    examples:
      accepted-first:
        input: '"long"'
        output: '"long"'
      accepted-second:
        input: '""'
        output: '""'
      accepted-third:
        input: '"ok"'
        output: '"ok"'
      rejected-by-all:
        input: '"bad"'
        error: |-
          Expected string | string | string, received "bad"
          - String must be 4 or more characters long
          - String must be 1 or fewer characters long
          - String must be exactly 2 characters long
      wrong-tag:
        input: "42"
        error: Expected string | string | string, received 42
  decode: identity
  encode: identity
