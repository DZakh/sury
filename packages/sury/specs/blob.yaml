# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.blob
  input: Blob
  output: Blob
  instantiations: 265
jsonSchema:
  input: Expected JSON, received Blob
  output: Expected JSON, received Blob
isEqual: strictEqual
compare: "throws: [Sury] Can't compare Blob. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{i instanceof e[0]||e[1](i);return i}catch(v0){e[2](v0)}}
    examples:
      valid:
        input: new Blob(["abc"])
        output: new Blob(["abc"])
      empty:
        input: new Blob([])
        output: new Blob([])
      file-is-a-blob:
        input: new File(["abc"], "a.txt")
        output: new File(["abc"], "a.txt")
      string-is-not-a-blob:
        input: '"abc"'
        error: Expected Blob, received "abc"
      uint8array-is-not-a-blob:
        input: new Uint8Array([1, 2, 3])
        error: Expected Blob, received Uint8Array
      null-is-not-a-blob:
        input: "null"
        error: Expected Blob, received null
  decode: identity
  encode: identity
