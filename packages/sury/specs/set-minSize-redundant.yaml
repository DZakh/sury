# yaml-language-server: $schema=./spec.schema.json
# FIXME: the size side drops a re-applied bound's message the same way
# number-gte-redundant and string-length-redundant do, and just as silently —
# see the FIXME there. One fix retires all three, since the message routing is
# shared.
ts:
  schema: S.instance(Set).with(S.minSize, 5).with(S.minSize, 1, "MY MESSAGE")
  input: Set<unknown>
  output: Set<unknown>
  instantiations: 7357
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: Expected JSON, received Set.size >= 5
  output: Expected JSON, received Set.size >= 5
operations:
  parse:
    expression: i=>{i instanceof e[1]||e[2](i);i.size>4||e[0](i);return i}
    examples:
      at-the-surviving-size:
        input: new Set([1, 2, 3, 4, 5])
        output: new Set([1, 2, 3, 4, 5])
      # FIXME: satisfies the bound the caller wrote second and is still
      # rejected — correctly, the first bound is the narrower one. It is the
      # "MY MESSAGE" that went with it, reported nowhere here, that is the bug.
      within-the-dropped-bound:
        input: new Set([1])
        error: Expected Set.size >= 5, received Set
      empty:
        input: new Set([])
        error: Expected Set.size >= 5, received Set
  decode:
    expression: i=>{i.size>4||e[0](i);return i}
    examples:
      at-the-surviving-size:
        input: new Set([1, 2, 3, 4, 5])
        output: new Set([1, 2, 3, 4, 5])
      within-the-dropped-bound:
        input: new Set([1])
        error: Expected Set.size >= 5, received Set
  encode:
    expression: i=>{i.size>4||e[0](i);return i}
    examples:
      at-the-surviving-size:
        input: new Set([1, 2, 3, 4, 5])
        output: new Set([1, 2, 3, 4, 5])
      within-the-dropped-bound:
        input: new Set([1])
        error: Expected Set.size >= 5, received Set
