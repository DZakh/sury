ts:
  schema: 'S.fromJSONSchemaOrThrow({ type: "string", minLength: 2, maxLength: 2, pattern: "^\\p{Letter}{2}$" })'
  input: string
  output: string
  instantiations: 753
jsonSchema:
  input: '{ type: "string", minLength: 2, maxLength: 2, pattern: "^\\p{Letter}{2}$" }'
  output: '{ type: "string", minLength: 2, maxLength: 2, pattern: "^\\p{Letter}{2}$" }'
isEqual: strictEqual
vs:
  zod: z.string()
operations:
  parse:
    expression: i=>{typeof i==="string"||e[3](i);i.length===2||e[1](i);e[0].test(i)||e[2](i);return i}
    examples:
      bmp-letters:
        input: '"éa"'
        output: '"éa"'
      astral-letters:
        input: '"𐐀𐐁"'
        error: Expected string.length == 2, received "𐐀𐐁"
        divergence:
          reason: the equivalent is a plain z.string(), the only spelling zod has for this document, so it accepts every value the refinements reject
          zod: '"𐐀𐐁"'
