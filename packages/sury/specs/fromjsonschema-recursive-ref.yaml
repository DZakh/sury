# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ $ref: "#/$defs/node", $defs: { node: { type: "object", properties: { value: { type: "string" }, children: { type: "array", items: { $ref: "#/$defs/node" } } }, required: ["value"] } } })'
  input: "{ value: string; children?: ...[] | undefined; }"
  output: "{ value: string; children?: ...[] | undefined; }"
  instantiations: 2808
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ $ref: "#/$defs/node", $defs: { node: { type: "object", properties: { value: { type: "string" }, children: { type: "array", items: { $ref: "#/$defs/node" } } }, required: ["value"] } } }'
  output: '{ $ref: "#/$defs/node", $defs: { node: { type: "object", properties: { value: { type: "string" }, children: { type: "array", items: { $ref: "#/$defs/node" } } }, required: ["value"] } } }'
operations:
  parse:
    expression: i=>{e[0](i);return i}
    examples:
      tree:
        input: '{ value: "root", children: [{ value: "leaf" }] }'
        output: '{ value: "root", children: [{ value: "leaf" }] }'
      leaf:
        input: '{ value: "leaf" }'
        output: '{ value: "leaf" }'
      deeply-nested:
        input: '{ value: "a", children: [{ value: "b", children: [{ value: "c" }] }] }'
        output: '{ value: "a", children: [{ value: "b", children: [{ value: "c" }] }] }'
      wrong-type-at-depth:
        input: '{ value: "root", children: [{ value: 1 }] }'
        error: Should pass every declared property schema.
      missing-required-at-depth:
        input: '{ value: "root", children: [{}] }'
        error: Should pass every declared property schema.
      not-matching-the-ref:
        input: '"any json"'
        error: 'Expected { [key: string]: JSON; }, received "any json"'
  decode: eq-to-parse
  encode: eq-to-parse
