# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ type: "string", minLength: 5, maxLength: 1 })'
  input: never
  output: never
  instantiations: 754
jsonSchema:
  input: "{ not: {} }"
  output: "{ not: {} }"
isEqual: (a,b)=>a===b||e[0](a,b)
compare: "throws: [Sury] Can't compare never. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      rejects:
        input: '"anything"'
        error: Expected never, received "anything"
  decode: eq-to-parse
  encode: eq-to-parse
