ts:
  schema: S.string
  input: string
  output: string
  instantiations: 254
vs:
  zod: z.string()
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[0](i);return i}catch(x){throw e[1](x,i)}}
    examples:
      valid:
        input: '"hello"'
        output: '"hello"'
      empty:
        input: '""'
        output: '""'
      invalid-number:
        input: "42"
        error: Expected string, received 42
      invalid-null:
        input: "null"
        error: Expected string, received null
  decode: identity
  encode: identity
