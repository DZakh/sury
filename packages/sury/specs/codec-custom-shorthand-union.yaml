# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.string.with(S.to, S.number, (value) => Number(value)), S.number])
  input: string | number
  output: number
  instantiations: 6072
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
  output: '{ type: "number" }'
operations:
  parse:
    expression: i=>{for(;;){if(typeof i==="string"){let v0;try{v0=e[0](i)}catch(x){e[1](x);e[2](x)}i=v0;break}if(typeof i==="number"&&!Number.isNaN(i))break;e[3](i)}return i}
    examples:
      custom-arm:
        input: '"12"'
        output: "12"
      sibling-arm:
        input: "5"
        output: "5"
  decode: eq-to-parse
  encode:
    creationError: "SuryError: Encoding is ambiguous when only a decode function is provided. Use S.to(target, {decode, encode})"
