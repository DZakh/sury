        input: '"9b2f4f0e-6a1e-7c3b-8b7a-1f2e3d4c5b6a"'
        error: Expected uuidv4, received "9b2f4f0e-6a1e-7c3b-8b7a-1f2e3d4c5b6a"
      variant-out-of-range:
        input: '"9b2f4f0e-6a1e-4c3b-cb7a-1f2e3d4c5b6a"'
        error: Expected uuidv4, received "9b2f4f0e-6a1e-4c3b-cb7a-1f2e3d4c5b6a"
      nil:
        input: '"00000000-0000-0000-0000-000000000000"'
        error: Expected uuidv4, received "00000000-0000-0000-0000-000000000000"
      empty:
        input: '""'
        error: Expected uuidv4, received ""
      not-a-string:
        input: "42"
        error: Expected uuidv4, received 42
