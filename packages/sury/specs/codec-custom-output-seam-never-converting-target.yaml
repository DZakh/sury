# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: '((S as any).$to as typeof S.to)(S.string, S.string.with(S.to, S.number), { decode: "never", encode: "auto" } as any)'
  input: string
  output: number
  instantiations: 4695
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "number" }'
isEqual: strictEqual
compare: strictCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    creationError: "SuryError: Nothing decodes string -> string. It is marked with S.never"
  decode: eq-to-parse
  encode:
    expression: i=>{return ""+i}
    examples:
      auto-converts-the-target:
        input: "42"
        output: '"42"'
