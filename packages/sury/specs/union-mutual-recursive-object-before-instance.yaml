  input: unknown
  output: unknown
  instantiations: 8121
jsonSchema:
  input: Expected JSON, received B | Date
  output: Expected JSON, received B | Date
isEqual: (a,b)=>a===b||e[0](a,b)
compare: "throws: [Sury] Can't compare B | Date. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{let v1;for(;;){try{let v0;v0=e[0](i);i=v0;break}catch(x){v1=[v1,e[2](x)]}if(i instanceof e[1])break;throw e[3](i,v1)}return i}catch(v2){e[4](v2)}}
    examples:
      # FIXME: the ref whose definition is another ref is read as opaque, so the
      # recursive object is tried first and reads the Date as an object.
      date:
        input: new Date("1970-01-01T00:00:01.000Z")
        output: "{ x: undefined, y: undefined }"
      object:
        input: "{ x: { y: {} } }"
        output: "{ x: { y: {} }, y: undefined }"
