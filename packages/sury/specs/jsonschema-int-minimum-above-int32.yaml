# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ type: "integer", minimum: 3000000000 })'
  input: number
  output: number
  instantiations: 495
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "integer", minimum: 3000000000 }'
  output: '{ type: "integer", minimum: 3000000000 }'
operations:
  parse:
    expression: i=>{typeof i==="number"&&i%1===0||e[1](i);i>=3000000000||e[0](i);return i}
    examples:
      at-the-minimum:
        input: "3000000000"
        output: "3000000000"
      above-the-minimum:
        input: "4000000000"
        output: "4000000000"
      below-the-minimum:
        input: "5"
        error: Expected integer >= 3000000000, received 5
      wrong-type:
        input: '"3000000000"'
        error: Expected integer >= 3000000000, received "3000000000"
  decode:
    expression: i=>{i>=3000000000||e[0](i);return i}
    examples:
      at-the-minimum:
        input: "3000000000"
        output: "3000000000"
      below-the-minimum:
        input: "5"
        error: Expected integer >= 3000000000, received 5
  encode:
    expression: i=>{i>=3000000000||e[0](i);return i}
    examples:
      at-the-minimum:
        input: "3000000000"
        output: "3000000000"
      below-the-minimum:
        input: "5"
        error: Expected integer >= 3000000000, received 5
