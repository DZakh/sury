# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.boolean)
  input: string
  output: boolean
  instantiations: 4419
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "boolean" }'
isEqual: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);let v0;(v0=i==="true")||i==="false"||e[0](i);return v0}
    examples:
      "true":
        input: '"true"'
        output: "true"
      "false":
        input: '"false"'
        output: "false"
      padded:
        input: '" true "'
        error: Expected boolean, received " true "
      capitalized:
        input: '"True"'
        error: Expected boolean, received "True"
      empty-string:
        input: '""'
        error: Expected boolean, received ""
      not-a-string:
        input: "true"
        error: Expected string, received true
  decode:
    expression: i=>{let v0;(v0=i==="true")||i==="false"||e[0](i);return v0}
    examples:
      valid:
        input: '"false"'
        output: "false"
  encode:
    expression: i=>{return ""+i}
    examples:
      valid:
        input: "true"
        output: '"true"'
