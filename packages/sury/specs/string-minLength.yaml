# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.minLength, 2)
  input: string
  output: string
  instantiations: 5181
vs:
  zod: z.string().min(2)
jsonSchema:
  input: '{ type: "string", minLength: 2 }'
  output: '{ type: "string", minLength: 2 }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      longer:
        input: '"abc"'
        output: '"abc"'
      shorter:
        input: '"a"'
        error: String must be 2 or more characters long
      empty:
        input: '""'
        error: String must be 2 or more characters long
      single-space:
        input: '" "'
        error: String must be 2 or more characters long
      wrong-type:
        input: "1"
        error: Expected string >= 2, received 1
  decode:
    expression: i=>{i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      shorter:
        input: '"a"'
        error: String must be 2 or more characters long
      empty:
        input: '""'
        error: String must be 2 or more characters long
  encode:
    expression: i=>{i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      shorter:
        input: '"a"'
        error: String must be 2 or more characters long
      empty:
        input: '""'
        error: String must be 2 or more characters long
