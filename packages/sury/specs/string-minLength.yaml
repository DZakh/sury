# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.minLength, 2)
  input: string
  output: string
  instantiations: 789
jsonSchema:
  input: '{ type: "string", minLength: 2 }'
  output: '{ type: "string", minLength: 2 }'
vs:
  zod: z.string().min(2)
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      longer:
        input: '"abc"'
        output: '"abc"'
      shorter:
        input: '"a"'
        error: Expected string.length >= 2, received "a"
      empty:
        input: '""'
        error: Expected string.length >= 2, received ""
      single-space:
        input: '" "'
        error: Expected string.length >= 2, received " "
      wrong-type:
        input: "1"
        error: Expected string.length >= 2, received 1
      wrong-type-null:
        input: "null"
        error: Expected string.length >= 2, received null
  decode:
    expression: i=>{i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      shorter:
        input: '"a"'
        error: Expected string.length >= 2, received "a"
      empty:
        input: '""'
        error: Expected string.length >= 2, received ""
  encode:
    expression: i=>{i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      shorter:
        input: '"a"'
        error: Expected string.length >= 2, received "a"
      empty:
        input: '""'
        error: Expected string.length >= 2, received ""
