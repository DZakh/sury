# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: "S.shape(S.string, (string) => ({ foo: string }))"
  input: string
  output: "{ foo: string; }"
  instantiations: 503
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  inputType: string
  output: '{ type: "object", properties: { foo: { type: "string" } }, required: ["foo"] }'
  outputType: "{ foo: string; }"
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return {"foo":i,}}
    examples:
      valid:
        input: '"bar"'
        output: '{ foo: "bar" }'
      not-a-string:
        input: "1"
        error: Expected string, received 1
  decode:
    expression: i=>{return {"foo":i,}}
    examples:
      valid:
        input: '"bar"'
        output: '{ foo: "bar" }'
  encode:
    expression: i=>{return i["foo"]}
    examples:
      round-trip:
        input: '{ foo: "bar" }'
        output: '"bar"'
