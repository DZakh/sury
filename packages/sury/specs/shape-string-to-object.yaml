# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: "S.shape(S.string, (string) => ({ foo: string }))"
  input: string
  output: "{ foo: string; }"
  instantiations: 503
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "object", properties: { foo: { type: "string" } }, required: ["foo"] }'
isEqual:
  input: strictEqual
  output: (a,b)=>a===b||a.foo===b.foo
compare:
  input: strictCompare
  output: (a,b)=>a===b?0:a.foo<b.foo?-1:a.foo>b.foo?1:0
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return {foo:i}}
    examples:
      valid:
        input: '"bar"'
        output: '{ foo: "bar" }'
      not-a-string:
        input: "1"
        error: Expected string, received 1
  decode:
    expression: i=>{return {foo:i}}
    examples:
      valid:
        input: '"bar"'
        output: '{ foo: "bar" }'
  encode:
    expression: i=>{return i.foo}
    examples:
      round-trip:
        input: '{ foo: "bar" }'
        output: '"bar"'
