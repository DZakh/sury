# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.json.with(S.to, S.union([S.bigint, S.string]))
  input: JSON
  output: string | bigint
  instantiations: 5394
jsonSchema:
  input: '{ type: "string" }'
  fromInputType: string
  output: Expected JSON, received bigint | string
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: strictEqual
compare:
  input: "throws: [Sury] Can't compare JSON. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare bigint | string. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{let v1;for(;;){if(typeof i==="string"){l2:{let v0;try{v0=BigInt(i)}catch(_){{(v1||(v1=[])).push(e[0],i,void 0);break l2}}if(!(v0||i.trim())){(v1||(v1=[])).push(e[1],i,void 0);break l2};i=v0;break}break}throw e[2](i,v1)}return i}catch(v3){e[3](v3)}}
    examples:
      bigint-string:
        input: '"123"'
        output: 123n
      catchall-string:
        input: '"abc"'
        output: '"abc"'
      no-double-decoding:
        input: "true"
        error: Expected bigint | string, received true
      number:
        input: "123"
        error: Expected bigint | string, received 123
      negative-bigint-string:
        input: '"-123"'
        output: -123n
  decode: eq-to-parse
  encode:
    expression: i=>{try{for(;;){if(typeof i==="bigint"){i=""+i;break}if(typeof i==="string")break;throw e[0](i)}return i}catch(v0){e[1](v0)}}
    examples:
      bigint:
        input: 123n
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
      numeric-string:
        input: '"123"'
        output: '"123"'
