# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.json.with(S.to, S.union([S.bigint, S.string]))
  input: JSON
  output: string | bigint
  instantiations: 6083
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: Expected JSON, received bigint | string
operations:
  parse:
    # FIXME: `else if(!(typeof i==="string"))` re-tests the condition it's already
    # the else of — always true, so it should be a bare `else`.
    expression: i=>{try{typeof i==="string"||e[1](i);let v0;try{v0=BigInt(i)}catch(_){e[0](i)}i=v0}catch(e1){if(!(typeof i==="string")){e[2](i,e1)}}return i}
    examples:
      bigint-string:
        input: '"123"'
        output: 123n
      # FIXME: the S.string member never gets a chance — a string that isn't a
      # bigint should fall back to it, not error. codec-string-union2-transformed
      # falls back in the same shape (its `falls-back-to-string` example).
      catchall-string:
        input: '"abc"'
        output: '"abc"'
      no-double-decoding:
        input: "true"
        error: |-
          Expected bigint | string, received true
          - Expected string, received true
      number:
        input: "123"
        error: |-
          Expected bigint | string, received 123
          - Expected string, received 123
      negative-bigint-string:
        input: '"-123"'
        output: -123n
  decode: eq-to-parse
  encode:
    expression: i=>{if(typeof i==="bigint"){i=""+i}else if(!(typeof i==="string")){e[0](i)}return i}
    examples:
      bigint:
        input: 123n
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
      numeric-string:
        input: '"123"'
        output: '"123"'
