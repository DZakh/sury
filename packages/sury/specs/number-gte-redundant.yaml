# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.number.with(S.gte, 5).with(S.gte, 1, "MY MESSAGE")
  input: number
  output: number
  instantiations: 815
jsonSchema:
  input: '{ type: "number", minimum: 5 }'
  output: '{ type: "number", minimum: 5 }'
vs:
  zod: z.number().gte(5).gte(1, "MY MESSAGE")
operations:
  parse:
    expression: i=>{typeof i==="number"&&i===i||e[1](i);i>=5||e[0](i);return i}
    examples:
      at-the-surviving-bound:
        input: "5"
        output: "5"
      between-the-two-bounds:
        input: "3"
        error: MY MESSAGE
      at-the-dropped-bound:
        input: "1"
        error: MY MESSAGE
      below-both:
        input: "0"
        error: MY MESSAGE
  decode:
    expression: i=>{i>=5||e[0](i);return i}
    examples:
      at-the-surviving-bound:
        input: "5"
        output: "5"
      between-the-two-bounds:
        input: "3"
        error: MY MESSAGE
  encode:
    expression: i=>{i>=5||e[0](i);return i}
    examples:
      at-the-surviving-bound:
        input: "5"
        output: "5"
      between-the-two-bounds:
        input: "3"
        error: MY MESSAGE
