# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: "S.fromJSONSchema({ enum: [] })"
  input: never
  output: never
  instantiations: 503
vs:
  zod: z.never()
jsonSchema:
  input: "{ enum: [] }"
  inputType: never
  output: "{ enum: [] }"
  outputType: never
operations:
  parse:
    expression: i=>{e[0](i);e[1](i)||e[2](i);return i}
    examples:
      rejects-string:
        input: '"anything"'
        error: Should equal one of the values in the enum property.
      rejects-null:
        input: "null"
        error: Should equal one of the values in the enum property.
  decode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      rejects-string:
        input: '"anything"'
        error: Should equal one of the values in the enum property.
  encode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      rejects-string:
        input: '"anything"'
        error: Should equal one of the values in the enum property.
