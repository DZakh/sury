# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: "S.fromJSONSchemaOrThrow({ enum: [] })"
  input: never
  output: never
  instantiations: 630
jsonSchema:
  input: "{ not: {} }"
  output: "{ not: {} }"
isEqual: (a,b)=>a===b||e[0](a,b)
vs:
  zod: z.never()
operations:
  parse:
    expression: i=>{e[0](i);return i}
    examples:
      rejects-string:
        input: '"anything"'
        error: Expected never, received "anything"
      rejects-null:
        input: "null"
        error: Expected never, received null
  decode: eq-to-parse
  encode: eq-to-parse
