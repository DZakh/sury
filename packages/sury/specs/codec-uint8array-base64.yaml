# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.uint8Array.with(S.to, S.base64)
  input: Uint8Array<ArrayBufferLike>
  output: string
  instantiations: 4419
jsonSchema:
  input: Expected JSON, received Uint8Array
  output: '{ type: "string", contentEncoding: "base64" }'
  openapi-3.0:
    output: '{ type: "string", format: "byte" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{i instanceof e[1]||e[2](i);return e[0](i)}
    examples:
      non-utf8-bytes:
        input: new Uint8Array([137, 80, 78, 71])
        output: '"iVBORw=="'
      empty:
        input: new Uint8Array([])
        output: '""'
      one-byte:
        input: new Uint8Array([255])
        output: '"/w=="'
  decode:
    expression: i=>{return e[0](i)}
    examples:
      non-utf8-bytes:
        input: new Uint8Array([137, 80, 78, 71])
        output: '"iVBORw=="'
  encode:
    expression: i=>{e[1](i)||e[2](i);return e[0](i)}
    examples:
      invalid-base64:
        input: '"!!"'
        error: Expected base64, received "!!"
      non-utf8-bytes:
        input: '"iVBORw=="'
        output: new Uint8Array([137, 80, 78, 71])
      empty:
        input: '""'
        output: new Uint8Array([])
