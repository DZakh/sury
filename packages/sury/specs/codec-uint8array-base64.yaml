# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.uint8Array.with(S.to, S.base64)
  input: Uint8Array<ArrayBufferLike>
  output: string
  instantiations: 5091
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: Expected JSON, received Uint8Array
  output: '{ type: "string", contentEncoding: "base64", pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$" }'
operations:
  parse:
    expression: i=>{i instanceof e[1]||e[2](i);return e[0](i)}
    examples:
      valid:
        input: new Uint8Array([72, 101, 108, 108, 111])
        output: '"SGVsbG8="'
      empty:
        input: new Uint8Array([])
        output: '""'
      high-bytes:
        input: new Uint8Array([255, 254, 253])
        output: '"//79"'
      not-a-uint8array:
        input: '"SGVsbG8="'
        error: Expected Uint8Array, received "SGVsbG8="
  decode:
    expression: i=>{return e[0](i)}
    examples:
      valid:
        input: new Uint8Array([72, 101, 108, 108, 111])
        output: '"SGVsbG8="'
  encode:
    expression: i=>{e[1].test(i)||e[2](i);return e[0](i)}
    examples:
      unpadded-rejected:
        input: '"SGVsbG8"'
        error: Expected base64, received "SGVsbG8"
