# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.minLength, 0)
  input: string
  output: string
  instantiations: 789
jsonSchema:
  input: '{ type: "string", minLength: 0 }'
  output: '{ type: "string", minLength: 0 }'
isEqual: strictEqual
compare: strictCompare
vs:
  zod: z.string().min(0)
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      empty:
        input: '""'
        output: '""'
      non-empty:
        input: '"ab"'
        output: '"ab"'
      wrong-type:
        input: "1"
        error: Expected string, received 1
  decode: identity
  encode: identity
