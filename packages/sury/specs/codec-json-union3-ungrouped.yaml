# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.json.with(S.to, S.union(["123", S.bigint, S.string]))
  input: JSON
  output: string | bigint
  instantiations: 5508
jsonSchema:
  input: '{ anyOf: [{ type: "string", const: "123" }, { type: "string" }] }'
  fromInputType: string
  output: Expected JSON, received "123" | bigint | string
  openapi-3.0:
    input: '{ anyOf: [{ type: "string", enum: ["123"] }, { type: "string" }] }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{for(;;){let r;if(typeof i==="string"&&i==="123")break;if(typeof i==="string"){try{let v0;try{v0=BigInt(i)}catch(_){e[0](i)}v0||i.trim()||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break}e[2](i,...(r||[]))}return i}
    examples:
      literal-member:
        input: '"123"'
        output: '"123"'
      bigint-string:
        input: '"124"'
        output: 124n
      catchall-string:
        input: '"abc"'
        output: '"abc"'
      empty-string:
        input: '""'
        output: '""'
      whitespace-string:
        input: '"   "'
        output: '"   "'
      no-double-decoding:
        input: "true"
        error: Expected "123" | bigint | string, received true
      number:
        input: "123"
        error: Expected "123" | bigint | string, received 123
  decode: eq-to-parse
  encode:
    expression: i=>{for(;;){if(typeof i==="string"&&i==="123")break;if(typeof i==="string")break;if(typeof i==="bigint"){i=""+i;break}e[0](i)}return i}
    examples:
      bigint:
        input: 123n
        output: '"123"'
      literal-member:
        input: '"123"'
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
