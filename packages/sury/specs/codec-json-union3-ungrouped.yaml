# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.json.with(S.to, S.union(["123", S.bigint, S.string]))
  input: JSON
  output: string | bigint
  instantiations: 6197
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ anyOf: [{ type: "string", const: "123" }, { type: "string" }] }'
  output: Expected JSON, received "123" | bigint | string
operations:
  parse:
    expression: i=>{if(!(typeof i==="string"&&i==="123")){try{typeof i==="string"||e[1](i);let v0;try{v0=BigInt(i)}catch(_){e[0](i)}i=v0}catch(e0){if(!(typeof i==="string")){e[2](i,e0)}}}return i}
    examples:
      literal-member:
        input: '"123"'
        output: '"123"'
      bigint-string:
        input: '"124"'
        output: 124n
      catchall-string:
        input: '"abc"'
        output: '"abc"'
      # FIXME: BigInt("") is 0n and BigInt("   ") is 0n, so blank strings decode to a
      # bigint instead of falling back to the S.string member.
      empty-string:
        input: '""'
        output: 0n
      whitespace-string:
        input: '"   "'
        output: 0n
      no-double-decoding:
        input: "true"
        error: |-
          Expected "123" | bigint | string, received true
          - Expected string, received true
      number:
        input: "123"
        error: |-
          Expected "123" | bigint | string, received 123
          - Expected string, received 123
  decode: eq-to-parse
  encode:
    expression: i=>{if(typeof i==="bigint"){i=""+i}else if(!(typeof i==="string")){e[0](i)}return i}
    examples:
      bigint:
        input: 123n
        output: '"123"'
      literal-member:
        input: '"123"'
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
