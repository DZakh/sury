# yaml-language-server: $schema=./spec.schema.json
# FIXME: the size family inherits string-length-supersedes-maxLength-message
# whole — a superseded bound keeps its check, so its message fires for some
# violations of the surviving bound and not others. `size(3)` narrows `maxSize`
# from 5 to 3 in the fields, but the `i.size<6` check is already in the refiner
# chain and can't be pulled back, so this schema advertises `Set.size == 3` and
# reports "MAX" for a 6-entry set and the generic message for a 4-entry one.
# Both are just "too big". The fix is the same one described there, and it has
# to land for both families at once: `internalRefine` has to be able to replace
# a check rather than only append one, and `size()` writes its message under
# both `minSize` and `maxSize` while the check it attaches reads only `minSize`.
ts:
  schema: S.instance(Set).with(S.maxSize, 5, "MAX").with(S.size, 3)
  input: Set<unknown>
  output: Set<unknown>
  instantiations: 7450
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  # FIXME: says `size == 3` and mentions neither the 5 the surviving check
  # still enforces nor the message attached to it.
  input: Expected JSON, received Set.size == 3
  output: Expected JSON, received Set.size == 3
operations:
  parse:
    expression: i=>{i instanceof e[2]||e[3](i);i.size<6||e[0](i);i.size===3||e[1](i);return i}
    examples:
      at-the-size:
        input: new Set([1, 2, 3])
        output: new Set([1, 2, 3])
      too-small:
        input: new Set([1, 2])
        error: Expected Set.size == 3, received Set
      # FIXME: too big for `size == 3`, reported generically...
      too-big-within-the-superseded-bound:
        input: new Set([1, 2, 3, 4])
        error: Expected Set.size == 3, received Set
      # FIXME: ...and too big in exactly the same way, reported as "MAX" — the
      # message of a bound this schema no longer advertises.
      too-big-past-the-superseded-bound:
        input: new Set([1, 2, 3, 4, 5, 6])
        error: MAX
      wrong-type:
        input: "null"
        error: Expected Set.size == 3, received null
  decode:
    expression: i=>{i.size<6||e[0](i);i.size===3||e[1](i);return i}
    examples:
      at-the-size:
        input: new Set([1, 2, 3])
        output: new Set([1, 2, 3])
      too-big-within-the-superseded-bound:
        input: new Set([1, 2, 3, 4])
        error: Expected Set.size == 3, received Set
      too-big-past-the-superseded-bound:
        input: new Set([1, 2, 3, 4, 5, 6])
        error: MAX
  encode:
    expression: i=>{i.size<6||e[0](i);i.size===3||e[1](i);return i}
    examples:
      at-the-size:
        input: new Set([1, 2, 3])
        output: new Set([1, 2, 3])
      too-big-within-the-superseded-bound:
        input: new Set([1, 2, 3, 4])
        error: Expected Set.size == 3, received Set
      too-big-past-the-superseded-bound:
        input: new Set([1, 2, 3, 4, 5, 6])
        error: MAX
