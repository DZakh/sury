# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.nullable(S.string)
  input: string | null
  output: string | undefined
  instantiations: 380
vs:
  zod:
    schema: z.string().nullable()
    divergence: "Sury bridges the two absent values: null decodes to undefined and undefined encodes back to null, so the output is what JS code actually pattern-matches on. Zod keeps null on both sides."
    output: string | null
jsonSchema:
  input: '{ anyOf: [{ type: "string" }, { type: "null" }] }'
  output: Expected JSON, received string | undefined
operations:
  parse:
    expression: i=>{if(i===null){i=void 0}else if(!(typeof i==="string")){e[0](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
      empty-string:
        input: '""'
        output: '""'
      null-bridges-to-undefined:
        input: "null"
        output: undefined
      invalid-undefined:
        input: undefined
        error: Expected string | null, received undefined
      invalid-type:
        input: "1"
        error: Expected string | null, received 1
  decode: eq-to-parse
  encode:
    expression: i=>{if(i===void 0){i=null}else if(!(typeof i==="string")){e[0](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
      empty-string:
        input: '""'
        output: '""'
      undefined-bridges-to-null:
        input: undefined
        output: "null"
      invalid-null:
        input: "null"
        error: Expected string | undefined, received null
      invalid-type:
        input: "1"
        error: Expected string | undefined, received 1
