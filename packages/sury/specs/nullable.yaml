# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.nullable(S.string)
  aliases:
    - S.nullable(S.nullable(S.nullable(S.string)))
  input: string | null
  output: string | null
  instantiations: 422
jsonSchema:
  input: '{ anyOf: [{ type: "null" }, { type: "string" }] }'
  output: '{ anyOf: [{ type: "null" }, { type: "string" }] }'
vs:
  zod: z.string().nullable()
operations:
  parse:
    expression: i=>{(i===null||typeof i==="string")||e[0](i);return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
      empty-string:
        input: '""'
        output: '""'
      null-passes-through:
        input: "null"
        output: "null"
      invalid-undefined:
        input: undefined
        error: Expected null | string, received undefined
      invalid-type:
        input: "1"
        error: Expected null | string, received 1
  decode: identity
  encode: identity
