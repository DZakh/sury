# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.uint8Array.with(S.to, S.number)
  input: Uint8Array<ArrayBufferLike>
  output: number
  instantiations: 4552
jsonSchema:
  input: Expected JSON, received Uint8Array
  output: '{ type: "number" }'
isEqual:
  input: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
  output: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    creationError: "SuryError: Can't decode Uint8Array -> number. Define custom codec with S.to"
  decode: eq-to-parse
  encode:
    creationError: "SuryError: Can't decode number -> Uint8Array. Define custom codec with S.to"
