ts:
  schema: S.union([S.string, S.number])
  input: string | number
  output: string | number
  instantiations: 972
  bundleBytes: 9767
vs:
  zod: z.union([z.string(), z.number()])
jsonSchema:
  input: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
  output: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
operations:
  parse:
    expression: i=>{if(!(typeof i==="string"||typeof i==="number"&&!Number.isNaN(i))){e[0](i)}return i}
    examples:
      valid-string:
        input: '"hello"'
        output: '"hello"'
      valid-number:
        input: "42"
        output: "42"
      invalid:
        input: "true"
        error: Expected string | number, received true
  decode: identity
  encode: identity
