# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.string, S.number])
  aliases:
    - S.anyOf([S.string, S.number])
  input: string | number
  output: string | number
  instantiations: 972
jsonSchema:
  input: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
  output: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
isEqual: strictEqual
compare: "throws: [Sury] Can't compare string | number. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod: z.union([z.string(), z.number()])
operations:
  parse:
    expression: i=>{try{(typeof i==="string"||typeof i==="number"&&i==i)||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      valid-string:
        input: '"hello"'
        output: '"hello"'
      valid-number:
        input: "42"
        output: "42"
      invalid:
        input: "true"
        error: Expected string | number, received true
  decode: identity
  encode: identity
