  aliases:
    - "S.fromJSONSchemaOrThrow({ oneOf: [] })"
    - "S.fromJSONSchemaOrThrow({ type: [] })"
  input: never
  output: never
  instantiations: 611
jsonSchema:
  input: "{ not: {} }"
  output: "{ not: {} }"
isEqual: (a,b)=>a===b||e[0](a,b)
vs:
  zod:
    _skip: not-applicable
operations:
