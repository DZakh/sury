# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.recursive("N", (self) => S.schema({ v: S.number, kid: S.optional(S.union([S.union([self, S.literal(null)]).with(S.meta, { description: "inner" }), S.string]).with(S.meta, { description: "outer" }), 5 as any) }))'
  input: unknown
  output: unknown
  instantiations: 9662
jsonSchema:
  input: '{ $ref: "#/$defs/N", $defs: { N: { type: "object", properties: { v: { type: "number" }, kid: { anyOf: [{ anyOf: [{ $ref: "#/$defs/N" }, { type: "null" }], description: "inner" }, { type: "string" }], description: "outer" } }, required: ["v"] } } }'
  fromInputType: "{ v: number; kid?: string | ... | null | undefined; }"
  output: '{ $ref: "#/$defs/N", $defs: { N: { type: "object", properties: { v: { type: "number" }, kid: { anyOf: [{ anyOf: [{ $ref: "#/$defs/N" }, { type: "null" }], description: "inner" }, { type: "string" }], description: "outer" } }, required: ["v", "kid"] } } }'
  fromOutputType: "{ v: number; kid: string | ... | null; }"
  openapi-3.0:
    input: '{ $ref: "#/$defs/N", $defs: { N: { type: "object", properties: { v: { type: "number" }, kid: { anyOf: [{ $ref: "#/$defs/N", nullable: true, description: "inner" }, { type: "string" }], description: "outer" } }, required: ["v"] } } }'
    output: '{ $ref: "#/$defs/N", $defs: { N: { type: "object", properties: { v: { type: "number" }, kid: { anyOf: [{ $ref: "#/$defs/N", nullable: true, description: "inner" }, { type: "string" }], description: "outer" } }, required: ["v", "kid"] } } }'
isEqual: (a,b)=>a===b||e[0](a,b)
compare: "throws: [Sury] Can't compare N. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{let v0;v0=e[0](i);return v0}catch(v1){e[1](v1)}}
    examples:
      # FIXME: the default beside a ref two described unions down goes unchecked, so a value N | null | string rejects is set
      kid-missing:
        input: "{ v: 1 }"
        output: "{ v: 1, kid: 5 }"
        divergence:
          reason: the unchecked default is set though the output schema rejects it
          ajv: "output: data/kid must be object, data/kid must be null, data/kid must match a schema in anyOf, data/kid must be string, data/kid must match a schema in anyOf"
      # FIXME: the default beside a ref two described unions down goes unchecked, so a value N | null | string rejects is set
      nested-kid-missing:
        input: "{ v: 1, kid: { v: 2 } }"
        output: "{ v: 1, kid: { v: 2, kid: 5 } }"
        divergence:
          reason: the unchecked default is set though the output schema rejects it
          ajv: "output: data/kid/kid must be object, data/kid/kid must be null, data/kid/kid must match a schema in anyOf, data/kid/kid must be string, data/kid/kid must match a schema in anyOf, data/kid must be null, data/kid must match a schema in anyOf, data/kid must be string, data/kid must match a schema in anyOf"
      kid-invalid:
        input: "{ v: 1, kid: 5 }"
        error: |-
          Failed at kid: Expected N | string | null, received 5
          - At kid: Expected N | null, received 5
  decode: eq-to-parse
  encode: eq-to-parse
