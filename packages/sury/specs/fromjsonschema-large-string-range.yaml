# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ type: "string", minLength: 100, maxLength: 50 })'
  input: never
  output: never
  instantiations: 828
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: "{ not: {} }"
  output: "{ not: {} }"
operations:
