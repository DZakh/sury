# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.maxLength, 5, "MAX").with(S.length, 3)
  input: string
  output: string
  instantiations: 1126
jsonSchema:
  input: '{ type: "string", minLength: 3, maxLength: 3 }'
  output: '{ type: "string", minLength: 3, maxLength: 3 }'
vs:
  zod: z.string().max(5, "MAX").length(3)
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);i.length===3||e[0](i);return i}
    examples:
      at-the-length:
        input: '"abc"'
        output: '"abc"'
      too-short:
        input: '"ab"'
        error: Expected string.length == 3, received "ab"
      too-long-within-the-superseded-bound:
        input: '"abcd"'
        error: Expected string.length == 3, received "abcd"
      too-long-past-the-superseded-bound:
        input: '"abcdef"'
        error: Expected string.length == 3, received "abcdef"
      wrong-type:
        input: "1"
        error: Expected string.length == 3, received 1
  decode:
    expression: i=>{i.length===3||e[0](i);return i}
    examples:
      at-the-length:
        input: '"abc"'
        output: '"abc"'
      too-long-within-the-superseded-bound:
        input: '"abcd"'
        error: Expected string.length == 3, received "abcd"
      too-long-past-the-superseded-bound:
        input: '"abcdef"'
        error: Expected string.length == 3, received "abcdef"
  encode:
    expression: i=>{i.length===3||e[0](i);return i}
    examples:
      at-the-length:
        input: '"abc"'
        output: '"abc"'
      too-long-within-the-superseded-bound:
        input: '"abcd"'
        error: Expected string.length == 3, received "abcd"
      too-long-past-the-superseded-bound:
        input: '"abcdef"'
        error: Expected string.length == 3, received "abcdef"
