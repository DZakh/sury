# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.array(S.string).with(S.maxLength, 2)
  input: string[]
  output: string[]
  instantiations: 5290
vs:
  zod: z.array(z.string()).max(2)
jsonSchema:
  input: '{ items: { type: "string" }, type: "array", maxItems: 2 }'
  output: '{ items: { type: "string" }, type: "array", maxItems: 2 }'
operations:
  parse:
    expression: i=>{try{Array.isArray(i)||e[2](i);for(let v0=0;v0<i.length;++v0){try{let v1=i[v0];typeof v1==="string"||e[0](v1);}catch(v2){v2.path='["'+v0+'"]'+v2.path;throw v2}}i.length<3||e[1](i);return i}catch(x){throw e[3](x,i)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      longer:
        input: '["a", "b", "c"]'
        error: Expected string[].length <= 2, received ["a", "b", "c"]
      shorter:
        input: '["a"]'
        output: '["a"]'
      empty:
        input: "[]"
        output: "[]"
      wrong-type:
        input: '"ab"'
        error: Expected string[].length <= 2, received "ab"
  decode:
    expression: i=>{try{i.length<3||e[0](i);return i}catch(x){throw e[1](x,i)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      shorter:
        input: '["a"]'
        output: '["a"]'
      empty:
        input: "[]"
        output: "[]"
  encode:
    expression: i=>{try{i.length<3||e[0](i);return i}catch(x){throw e[1](x,i)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      shorter:
        input: '["a"]'
        output: '["a"]'
      empty:
        input: "[]"
        output: "[]"
