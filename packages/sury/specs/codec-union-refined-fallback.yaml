ts:
  schema: S.union([S.string.with(S.minLength, 3), S.number, S.string])
  input: string | number
  output: string | number
  instantiations: 1758
jsonSchema:
  input: '{ anyOf: [{ type: "string", minLength: 3 }, { type: "number" }, { type: "string" }] }'
  output: '{ anyOf: [{ type: "string", minLength: 3 }, { type: "number" }, { type: "string" }] }'
vs:
  zod: z.union([z.string().min(3), z.number(), z.string()])
operations:
  parse:
    expression: i=>{for(;;){if(typeof i==="string"){for(;;){let r;try{i.length>2||e[0](i);break}catch(x){(r||(r=[])).push(e[1](x))}break;};break}if(typeof i==="number"&&i===i)break;e[2](i)}return i}
    examples:
      long-string-matches-the-refined-member:
        input: '"abcd"'
        output: '"abcd"'
      short-string-falls-through-to-the-catch-all:
        input: '"ab"'
        output: '"ab"'
      empty-string-falls-through:
        input: '""'
        output: '""'
      number:
        input: "42"
        output: "42"
      grouped-past-the-number-member:
        input: "-0"
        output: "-0"
