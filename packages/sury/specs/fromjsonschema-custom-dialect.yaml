# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ "$schema": "https://example.com/custom", "$ref": "#/$defs/value", minLength: 3, "$defs": { value: { type: "string" } } })'
  input: string
  output: string
  instantiations: 797
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
isEqual: strictEqual
compare: strictCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      ignored-sibling:
        input: '"a"'
        output: '"a"'
      wrong-type:
        input: "1"
        error: Expected string, received 1
  decode: identity
  encode: identity
