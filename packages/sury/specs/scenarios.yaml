# yaml-language-server: $schema=./scenarios.schema.json
#
# Consumer-level performance scenarios, measured by `spec check --perf`
# alongside the specs. A spec times a schema's creation, compilation and
# compiled operation; a scenario times a whole call the way a consumer writes
# it, so the dispatch around the compiled operation is inside the measurement.
# Nothing is snapshotted - only the delta against the baseline is reported.
#
# Put the schema and the input in `prepare`; only `run` is timed.

standard-schema-validate:
  prepare: |
    const schema = S.schema({
      id: S.string,
      age: S.number,
      tags: S.array(S.string),
    });
    const data = { id: "u1", age: 30, tags: ["a", "b"] };
  # What every Standard Schema consumer calls, per request. The contract is a
  # per-call property read plus a call, so neither half can be hoisted away.
  run: schema["~standard"].validate(data)

standard-schema-validate-invalid:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const data = { id: "u1", age: "30" };
  # The failure path returns issues rather than throwing, so the error
  # construction it does is part of what a consumer pays on bad input.
  run: schema["~standard"].validate(data)

is-input:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const data = { id: "u1", age: 30 };
  # A caller that doesn't hoist the operation pays the lookup per call; the
  # next scenario is what hoisting it saves.
  run: S.isInput(schema)(data)

is-input-compiled:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const validate = S.isInput(schema);
    const data = { id: "u1", age: 30 };
  run: validate(data)

is-input-invalid:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const validate = S.isInput(schema);
    const data = { id: "u1", age: "30" };
  # The answer is `false`, and nothing reads why: the failure leaves the
  # operation without building a record or throwing one.
  run: validate(data)

is-output:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number.with(S.to, S.string) });
    const data = { id: "u1", age: "30" };
  # Same dispatch through `reverse` - a second cache on a second schema.
  run: S.isOutput(schema)(data)

assert-input-or-throw:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const data = { id: "u1", age: 30 };
  run: S.assertInputOrThrow(schema, data)

make-output:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const construct = S.makeOutputOrThrow(schema);
    const value = { id: "u1", age: 30 };
  # What building an entity costs once the operation is compiled: the checks,
  # and the value handed back straight out of the generated body.
  run: construct(value)

parse-lookup:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
  # No parsing at all: the cost of asking an already-compiled schema for its
  # operation, which is what a caller that doesn't hoist `S.parseOrThrow`
  # repeats on every call.
  run: S.parseOrThrow(schema)

alternating-lookup:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
  # Two different operations on the same schema per call. The one-entry memo
  # misses on every lookup here, so this times the miss path - the pattern a
  # single-slot cache is most at risk of making slower than no cache at all.
  run: (S.parseOrThrow(schema), S.decodeOrThrow(schema))

decode-pipeline-lookup:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
  # A two-schema pipeline, unhoisted. The lookup walks the same memo list as
  # `parse-lookup` but matches a longer key, so the two together show what the
  # key's width costs.
  run: S.decodeOrThrow(S.jsonString, schema)

encode-lookup:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number.with(S.to, S.string) });
  # Same, through `reverse` - a second cache on a second schema.
  run: S.encodeOrThrow(schema)

inline-pipeline-lookup:
  prepare: |
    const item = S.schema({ id: S.string, age: S.number });
    const data = '{"id":"u1","age":30}';
  # The schema is built inside the timed call, the way a handler that never
  # hoists writes it. Every `S.to` here is a cache lookup rather than a chain
  # rebuild; without that the whole schema recompiles per call.
  run: S.parseOrThrow(S.jsonString.with(S.to, item))(data)

inline-reading-lookup:
  prepare: |
    const data = "eyJhIjoxfQ==";
  # A content reading written inline, the shape `S.to(a, b, "unpack")` takes in
  # a handler. The reading joins the link key, so this is a lookup rather than a
  # chain rebuild and a recompile.
  run: S.parseOrThrow(S.to(S.base64, S.jsonString, "unpack"))(data)

base64-pack:
  prepare: |
    const encode = S.encodeOrThrow(S.schema({ payload: S.uint8Array }), S.jsonString);
    const data = { payload: new Uint8Array(1024).fill(137) };
  # Bytes in a JSON value position. Where the runtime has no
  # `Uint8Array.prototype.toBase64` the fallback builds an intermediate binary
  # string per value, so this is the size the packing actually costs.
  run: encode(data)

base64-unpack:
  prepare: |
    const decode = S.decodeOrThrow(S.jsonString, S.schema({ payload: S.uint8Array }));
    const data = JSON.stringify({ payload: "aVBORw0KGgoA".repeat(128) });
  # The other half: the base64 read plus the pattern check that lets it skip a
  # `try` around `atob`.
  run: decode(data)

parse-or-throw:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const data = { id: "u1", age: 30 };
  # The whole call a consumer writes: argument dispatch, the operation lookup
  # and the parse, none of it hoisted.
  run: S.parseOrThrow(schema, data)

parse-as-result:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const data = { id: "u1", age: 30 };
  # Same, for the Result outcome. What `S.safe(() => S.parseOrThrow(schema)(data))`
  # used to cost - a closure and a frame per call, plus a `try` the compiler
  # can now sometimes skip entirely.
  run: S.parseAsResult(schema, data)

parse-as-result-compiled:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const parse = S.parseAsResult(schema);
    const data = { id: "u1", age: 30 };
  run: parse(data)

parse-as-result-invalid:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const parse = S.parseAsResult(schema);
    const data = { id: "u1", age: "30" };
  # The failure path is what a Result outcome exists for, so it is the half
  # worth watching.
  run: parse(data)

parse-array-20:
  prepare: |
    const parse = S.parseOrThrow(S.array(S.string));
    const data = Array(20).fill("ok");
  # Twenty valid items. The generated loop used to wrap each element in
  # try/catch to prepend the index on failure; the valid path now has no catch.
  run: parse(data)

parse-array-20-invalid:
  prepare: |
    const parse = S.parseAsResult(S.array(S.string));
    const data = Array(20).fill("ok");
    data[19] = 0;
  # Last item is not a string. Result, not throw: the fail helper receives the
  # index as an argument instead of catching and prepending it.
  run: parse(data)

parse-nested-invalid:
  prepare: |
    const parse = S.parseAsResult(
      S.array(S.schema({ tags: S.array(S.string) })),
    );
    const data = Array.from({ length: 20 }, () => ({ tags: ["a", "b"] }));
    data[19] = { tags: ["a", 1] };
  # Two dynamic segments: item index and inner index. A catch-rethrow paid a
  # throw per level; the fail site now builds the whole path at once.
  run: parse(data)

parse-as-result-consumed:
  prepare: |
    const parse = S.parseAsResult(S.schema({ id: S.string, age: S.number }));
    const data = { id: "u1", age: 30 };
  # The Result branched on at the call site and never kept, which is how most
  # consumers write it. Nothing outlives the frame, so the wrapper is dropped
  # rather than allocated: measured at 7.0ns against 6.4ns for the same parse
  # through `parseOrThrow`, and flat whatever keys the Result carries.
  # `parse-as-result-compiled` above is the other half, where it is kept.
  run: "(() => { const r = parse(data); return r.success ? r.value.age : -1 })()"

result-read:
  prepare: |
    const parse = S.parseAsResult(S.schema({ id: S.string, age: S.number }));
    const ok = parse({ id: "u1", age: 30 });
    const bad = parse({ id: "u1", age: "30" });
  # Both branches read at one site, which is what the shared key order buys.
  # Drop a key from either branch and these reads go polymorphic: about 1.2ns
  # per read, against the ~1ns per construction the shared key costs.
  run: "(ok.success ? ok.value.age : ok.issues.length) + (bad.success ? bad.value.age : bad.issues.length)"

is-equal:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const a = { id: "u1", age: 30 };
    const b = { id: "u1", age: 30 };
  # The dispatch plus the comparison - what a caller that doesn't hoist the
  # comparator pays on every check.
  run: S.isEqualOutput(schema, a, b)

is-equal-compiled:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const isEqual = S.isEqualOutput(schema);
    const a = { id: "u1", age: 30 };
    const b = { id: "u1", age: 30 };
  # The comparison alone: two field reads, no validation, no allocation. This
  # is the form a memo or a cache guard hoists.
  run: isEqual(a, b)

is-equal-nested:
  prepare: |
    const schema = S.schema({ id: S.string, tags: S.array(S.string) });
    const isEqual = S.isEqualOutput(schema);
    const a = { id: "u1", tags: ["a", "b", "c"] };
    const b = { id: "u1", tags: ["a", "b", "c"] };
  # An array field is the one shape that leaves the flat conjunction: a call
  # into the compiled element comparator, once per array rather than per item.
  run: isEqual(a, b)

is-equal-optional:
  prepare: |
    const schema = S.schema({ id: S.string, meta: S.optional(S.schema({ tag: S.string })) });
    const isEqual = S.isEqualOutput(schema);
    const a = { id: "u1", meta: { tag: "x" } };
    const b = { id: "u1", meta: { tag: "x" } };
  # The commonest wrapper there is, and the one shape where which side the
  # dispatch tests decides the cost: one `===` against the literal, where
  # narrowing on the member would write four operators and read `b` twice.
  run: isEqual(a, b)

protobuf-encode:
  prepare: |
    const Message = S.schema({
      id: S.string.with(S.protobufField, { number: 1, type: "uint32" }),
      name: S.string.with(S.protobufField, { number: 2, type: "string" }),
      tags: S.array(S.int32).with(S.protobufField, { number: 3, type: "sint32" }),
    })
    const encode = S.decodeOrThrow(Message, S.protobuf)
    const data = { id: "150", name: "Ada", tags: [-1, 0, 2] }
  run: encode(data)

protobuf-decode:
  prepare: |
    const Message = S.schema({
      id: S.string.with(S.protobufField, { number: 1, type: "uint32" }),
      name: S.string.with(S.protobufField, { number: 2, type: "string" }),
      tags: S.array(S.int32).with(S.protobufField, { number: 3, type: "sint32" }),
    })
    const decode = S.decodeOrThrow(S.protobuf, Message)
    const bytes = new Uint8Array([8, 150, 1, 18, 3, 65, 100, 97, 26, 3, 1, 0, 4])
  run: decode(bytes)

protobuf-decode-packed:
  prepare: |
    const Feature = S.schema({
      geometry: S.array(S.integer).with(S.protobufField, { number: 4, type: "uint32" }),
      deltas: S.array(S.int32).with(S.protobufField, { number: 5, type: "sint32" }),
    })
    const decode = S.decodeOrThrow(S.protobuf, Feature)
    const bytes = S.decodeOrThrow(Feature, S.protobuf)({
      geometry: Array.from({ length: 300 }, (_, i) => (i * 17) & 0x3fff),
      deltas: Array.from({ length: 300 }, (_, i) => i - 150),
    }).slice()
  # A vector tile's geometry: packed varints of one and two bytes, the loop a
  # packed reader spends its time in.
  run: decode(bytes)

parse-or-throw-invalid:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const parse = S.parseOrThrow(schema);
    const data = { id: "u1", age: "30" };
  # The one outcome where a failure really becomes an exception, so the one
  # that pays for a stack. Everything else - a Result, a union trying its next
  # member - gets a record with no stack at all.
  run: (() => { try { return parse(data) } catch (error) { return error } })()

parse-or-throw-invalid-message:
  prepare: |
    const schema = S.schema({ id: S.string, age: S.number });
    const parse = S.parseOrThrow(schema);
    const data = { id: "u1", age: "30" };
  # Same failure, with the message read. `reason` is rendered here rather than
  # at the throw, so this is the half a caller that only logs the error pays
  # and the one above does not.
  run: (() => { try { return parse(data) } catch (error) { return error.message } })()

union-fallback-accepts:
  prepare: |
    const schema = S.array(S.union([S.schema({ a: S.string }), S.schema({ b: S.number })]));
    const parse = S.parseOrThrow(schema);
    const data = Array.from({ length: 20 }, (_, i) => (i % 2 ? { a: "x" } : { b: 1 }));
  # Every other item is accepted by the second member only, so the first one
  # fails on the valid path. What it found is kept for a union failure that
  # never comes.
  run: parse(data)

union-dispatch-fallback:
  prepare: |
    const schema = S.union([
      S.schema({ kind: S.literal("a"), a: S.string }),
      S.schema({ kind: S.literal("b"), b: S.number }),
      S.schema({ kind: S.literal("c"), c: S.boolean }),
    ]);
    const parse = S.parseAsResult(schema);
    const data = { kind: "d" };
  # A union is where a failure is control flow: every member that rejects the
  # value builds an error nobody ever throws at a user, and the consolidated
  # one reads each member's reason.
  run: parse(data)

recursive-definer-defaults:
  # Building a recursive schema whose fields have defaults. Each default is
  # checked against its item when the schema is built, and inside a definer
  # that check once copied every item, missing the operation cached on it.
  run: |
    S.recursive("Node", (node) =>
      S.schema({
        a: S.optional(S.string, "x"),
        b: S.optional(S.number, 1),
        c: S.optional(S.boolean, false),
        kid: S.optional(node),
      }),
    )

recursive-tree-parse:
  prepare: |
    const node = S.recursive("Node", (self) => S.schema({ id: S.number, left: S.optional(self), right: S.optional(self) }));
    const build = (d) => (d === 0 ? { id: d } : { id: d, left: build(d - 1), right: build(d - 1) });
    const tree = build(6);
    const parse = S.parseOrThrow(node);
  # 127 nodes and 128 absent children: the leaves are where an optional
  # recursive field dispatches on `undefined`.
  run: parse(tree)

optional-json-absent:
  prepare: |
    const parse = S.parseOrThrow(S.schema({ id: S.string, meta: S.optional(S.json) }));
    const data = { id: "u1" };
  # `S.json` is a ref to a union, so nothing guards its arm: the absent field
  # has to be dispatched to `undefined` without trying the JSON check first.
  run: parse(data)
