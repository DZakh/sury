  input: "{ a: string; }"
  output: "{ a: string; }"
  instantiations: 1205
jsonSchema:
  input: '{ type: "object", properties: { a: { type: "string" } }, required: ["a"] }'
  output: '{ type: "object", properties: { a: { type: "string" } }, required: ["a"] }'
vs:
