# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ "$schema": "https://json-schema.org/draft/2020-12/schema", "$ref": "#/$defs/base", type: "object", properties: { b: { type: "number" } }, required: ["b"], "$defs": { base: { type: "object", properties: { a: { type: "string" } }, required: ["a"], additionalProperties: true } } })'
  input: "{ a: string; } & { b: number; }"
  output: "{ a: string; } & { b: number; }"
  instantiations: 5337
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "object", properties: { a: { type: "string" } }, required: ["a"], allOf: [{ type: "object", properties: { b: { type: "number" } }, required: ["b"] }], $schema: "https://json-schema.org/draft/2020-12/schema" }'
  output: '{ type: "object", properties: { a: { type: "string" } }, required: ["a"], allOf: [{ type: "object", properties: { b: { type: "number" } }, required: ["b"] }], $schema: "https://json-schema.org/draft/2020-12/schema" }'
operations:
  parse:
    expression: i=>{typeof i==="object"&&i&&!Array.isArray(i)||e[3](i);e[2](i)||e[4](i);let v1=i["a"];typeof v1==="string"||e[1](v1);for(let v0 in i){if(v0!=="a"){try{e[0](i[v0]);}catch(v2){v2.path='["'+v0+'"]'+v2.path;throw v2}}}return i}
    examples:
      valid:
        input: '{ a: "ok", b: 1, extra: true }'
        output: '{ a: "ok", b: 1, extra: true }'
      missing-base-property:
        input: "{ b: 1 }"
        error: 'Failed at ["a"]: Expected string, received undefined'
      missing-sibling-property:
        input: '{ a: "ok" }'
        error: Should pass the keywords adjacent to the $ref.
      invalid-sibling-property:
        input: '{ a: "ok", b: "no" }'
        error: Should pass the keywords adjacent to the $ref.
  decode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      valid:
        input: '{ a: "ok", b: 1, extra: true }'
        output: '{ a: "ok", b: 1, extra: true }'
  encode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      valid:
        input: '{ a: "ok", b: 1, extra: true }'
        output: '{ a: "ok", b: 1, extra: true }'
