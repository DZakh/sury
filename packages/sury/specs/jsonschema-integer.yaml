# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ type: "integer" })'
  input: number
  output: number
  instantiations: 387
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "integer" }'
  output: '{ type: "integer" }'
operations:
  parse:
    expression: i=>{typeof i==="number"&&i%1===0||e[0](i);return i}
    examples:
      valid:
        input: "42"
        output: "42"
      valid-above-int32:
        input: "3000000000"
        output: "3000000000"
      invalid-float:
        input: "42.5"
        error: Expected integer, received 42.5
  decode: identity
  encode: identity
