# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ "$schema": "https://json-schema.org/draft/2020-12/schema", "$ref": "#/$defs/N", allOf: [{ required: ["foo"] }], "$defs": { N: { type: "object", properties: { next: { "$ref": "#/$defs/N" } } } } })'
  input: "{ next?: ... | undefined; }"
  output: "{ next?: ... | undefined; }"
  instantiations: 3788
jsonSchema:
  input: '{ $ref: "#/$defs/N", allOf: [{ required: ["foo"] }], $defs: { N: { type: "object", properties: { next: { $ref: "#/$defs/N" } } } } }'
  output: '{ $ref: "#/$defs/N", allOf: [{ required: ["foo"] }], $defs: { N: { type: "object", properties: { next: { $ref: "#/$defs/N" } } } } }'
isEqual: (a,b)=>a===b||e[0](a,b)
compare: "throws: [Sury] Can't compare N. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{let v0;v0=e[0](i);e[1](i)||e[2](i);return v0}catch(v1){e[3](v1)}}
    examples:
      # FIXME: a cyclic $ref target is one shared definition, so the object it
      # names strips `foo` before the allOf beside the $ref reads it.
      allof-satisfied:
        input: "{ foo: 1 }"
        output: "{ next: undefined }"
  decode:
    expression: i=>{try{e[0](i);e[1](i)||e[2](i);return i}catch(v0){e[3](v0)}}
    examples:
      allof-satisfied:
        input: "{ foo: 1 }"
        output: "{ foo: 1 }"
  encode:
    expression: i=>{try{e[0](i);e[1](i)||e[2](i);return i}catch(v0){e[3](v0)}}
    examples:
      allof-satisfied:
        input: "{ foo: 1 }"
        output: "{ foo: 1 }"
