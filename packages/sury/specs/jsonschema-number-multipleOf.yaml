jsonSchema:
  input: '{ type: "number", multipleOf: 2.5 }'
  output: '{ type: "number", multipleOf: 2.5 }'
operations:
  parse:
    expression: i=>{typeof i==="number"&&!Number.isNaN(i)||e[1](i);i%2.5===0||e[0](i);return i}
    examples:
      valid:
        input: "5"
        output: "5"
      valid-fractional-multiple:
        input: "7.5"
        output: "7.5"
      valid-zero:
        input: "0"
        output: "0"
      invalid:
        input: "6"
        error: Expected multiple of 2.5
      invalid-fraction:
        input: "2.6"
        error: Expected multiple of 2.5
  decode:
    expression: i=>{i%2.5===0||e[0](i);return i}
    examples:
      valid:
        input: "5"
        output: "5"
      invalid:
        input: "6"
        error: Expected multiple of 2.5
  encode:
    expression: i=>{i%2.5===0||e[0](i);return i}
