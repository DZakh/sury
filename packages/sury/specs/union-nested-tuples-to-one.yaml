# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.tuple([S.tuple(["a"])]), S.tuple([S.tuple(["b"])])]).with(S.to, S.tuple([S.tuple(["a"])]))
  input: '[["a"]] | [["b"]]'
  output: '[["a"]]'
  instantiations: 6999
jsonSchema:
  input: '{ type: "array", minItems: 1, maxItems: 1, items: [{ type: "array", minItems: 1, maxItems: 1, items: [{ type: "string", const: "a" }] }] }'
  fromInputType: '[["a"]]'
  output: '{ type: "array", minItems: 1, maxItems: 1, items: [{ type: "array", minItems: 1, maxItems: 1, items: [{ type: "string", const: "a" }] }] }'
  draft-2020-12:
    input: '{ type: "array", minItems: 1, maxItems: 1, prefixItems: [{ type: "array", minItems: 1, maxItems: 1, prefixItems: [{ type: "string", const: "a" }] }], $schema: "https://json-schema.org/draft/2020-12/schema" }'
    output: '{ type: "array", minItems: 1, maxItems: 1, prefixItems: [{ type: "array", minItems: 1, maxItems: 1, prefixItems: [{ type: "string", const: "a" }] }], $schema: "https://json-schema.org/draft/2020-12/schema" }'
  openapi-3.0:
    input: '{ type: "array", minItems: 1, maxItems: 1, items: { anyOf: [{ type: "array", minItems: 1, maxItems: 1, items: { anyOf: [{ type: "string", enum: ["a"] }] } }] } }'
    output: '{ type: "array", minItems: 1, maxItems: 1, items: { anyOf: [{ type: "array", minItems: 1, maxItems: 1, items: { anyOf: [{ type: "string", enum: ["a"] }] } }] } }'
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: alwaysEqual
compare:
  input: "throws: [Sury] Can't compare [[\"a\"]] | [[\"b\"]]. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: alwaysCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    creationError: "SuryError: Ambiguous [[\"a\"]] | [[\"b\"]] -> [[\"a\"]]. [[\"b\"]] isn't [[\"a\"]]. Choose with S.to for [[\"b\"]] -> [[\"a\"]], or S.never -> [[\"b\"]]"
  decode: eq-to-parse
  encode: identity
