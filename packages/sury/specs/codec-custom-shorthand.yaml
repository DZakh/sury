ts:
  schema: S.string.with(S.to, S.number, (value) => Number(value))
  input: string
  output: number
  instantiations: 5266
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "number" }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);let v0;try{v0=e[0](i)}catch(x){e[1](x)}return v0}
    examples:
      valid:
        input: '"123"'
        output: "123"
      trusted-nan:
        input: '"abc"'
        output: NaN
      invalid-type:
        input: "1"
        error: Expected string, received 1
  decode:
    expression: i=>{let v0;try{v0=e[0](i)}catch(x){e[1](x)}return v0}
    examples:
      valid:
        input: '"123"'
        output: "123"
  encode:
    creationError: "SuryError: Encoding is ambiguous when only a decode function is provided. Use S.to(target, {decode, encode})"
