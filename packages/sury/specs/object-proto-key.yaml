# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.object({["__proto__"]: S.string})'
  input: "{ __proto__: string; }"
  output: "{ __proto__: string; }"
  instantiations: 1204
vs:
  zod:
    _skip: not-applicable
# FIXME: `__proto__` is a live prototype setter in every place this schema
# touches a plain object, and `parse.expression` below still walks into it: it
# builds its result as `{"__proto__":v0,}`, and a quoted key in an object literal
# is still prototype syntax, so the validated value is assigned to the prototype
# and the key is dropped — a valid input parses to `{}`. `{["__proto__"]:v0}`
# would fix it, at the cost of that form on every emitted object.
# `reverse` used to have the same bug through its property dict, which reparented
# the reversed dict onto the property's own schema and made `outputExpression`
# render schema internals; that one is fixed (Object.create(null) in reverseDict,
# the guard fromJSONSchema already uses for this key).
# Both `jsonSchema` sides below are harness markers rather than schemas because
# S.toJSONSchema builds `properties` by plain assignment, so the emitted
# document's own prototype is polluted the same way.
jsonSchema:
  input: cannot represent a Object instance as spec source code
  inputType: cannot represent a Object instance as spec source code
  output: cannot represent a Object instance as spec source code
  outputType: cannot represent a Object instance as spec source code
operations:
  parse:
    expression: i=>{typeof i==="object"&&i&&!Array.isArray(i)||e[1](i);let v0=i["__proto__"];typeof v0==="string"||e[0](v0);return {"__proto__":v0,}}
    examples:
      not-an-object:
        input: '"nope"'
        error: 'Expected { __proto__: string; }, received "nope"'
      array-input:
        input: "[]"
        error: "Expected { __proto__: string; }, received []"
      # FIXME: reads the inherited Object.prototype rather than undefined, the
      # same prototype-chain leak object-reserved-names.yaml pins for
      # `constructor` and `hasOwnProperty`.
      missing-field:
        input: "{}"
        error: 'Failed at ["__proto__"]: Expected string, received {}'
      # FIXME: the one valid input. The result literal `{"__proto__":v0,}` runs
      # the prototype setter (a string is ignored), so the key is dropped and a
      # valid input parses to `{}` — the bug the comment above describes,
      # pinned end to end.
      present-key-is-dropped:
        input: '{ ["__proto__"]: "x" }'
        output: "{}"
  decode: identity
  encode: identity
