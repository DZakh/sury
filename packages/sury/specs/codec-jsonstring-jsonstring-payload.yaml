# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: "S.jsonString.with(S.to, S.jsonString.with(S.to, S.schema({ a: S.string })))"
  input: string
  output: "{ a: string; }"
  instantiations: 5845
jsonSchema:
  # FIXME: `encodeToJsonSchema` reverses and parses to learn the input's shape,
  # and a document carrying a document hands it back a node of the same shape,
  # so it recurses until the stack goes. Predates the content axis — identical
  # on main — but this work is what makes a nested payload something to write.
  input: Maximum call stack size exceeded
  output: '{ type: "object", properties: { a: { type: "string" } }, required: ["a"] }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[3](i);let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="object"&&v0&&!Array.isArray(v0)||e[2](v0);let v1=v0["a"];typeof v1==="string"||e[1](v1);return {a:v1}}
    examples:
      one-parse:
        input: '"{\"a\":\"b\"}"'
        output: '{ a: "b" }'
      not-json:
        input: '"nope"'
        error: Expected JSON string, received "nope"
  decode:
    expression: i=>{let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="object"&&v0&&!Array.isArray(v0)||e[2](v0);let v1=v0["a"];typeof v1==="string"||e[1](v1);return {a:v1}}
    examples:
      one-parse:
        input: '"{\"a\":\"b\"}"'
        output: '{ a: "b" }'
  encode:
    expression: i=>{return "{\"a\":"+e[0](i["a"])+"}"}
    examples:
      one-serialize:
        input: '{ a: "b" }'
        output: '"{\"a\":\"b\"}"'
