# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.number.with(S.gte, 5)
  input: number
  output: number
  instantiations: 583
jsonSchema:
  input: '{ type: "number", minimum: 5 }'
  output: '{ type: "number", minimum: 5 }'
vs:
  zod: z.number().gte(5)
operations:
  parse:
    expression: i=>{typeof i==="number"&&i===i||e[1](i);i>=5||e[0](i);return i}
    examples:
      just-above:
        input: "5.5"
        output: "5.5"
      above:
        input: "6"
        output: "6"
      at-the-bound:
        input: "5"
        output: "5"
      below:
        input: "4"
        error: Expected number >= 5, received 4
      infinity:
        input: Infinity
        output: Infinity
      nan:
        input: NaN
        error: Expected number >= 5, received NaN
      wrong-type:
        input: '"6"'
        error: Expected number >= 5, received "6"
  decode:
    expression: i=>{i>=5||e[0](i);return i}
    examples:
      just-above:
        input: "5.5"
        output: "5.5"
      at-the-bound:
        input: "5"
        output: "5"
      below:
        input: "4"
        error: Expected number >= 5, received 4
  encode:
    expression: i=>{i>=5||e[0](i);return i}
    examples:
      just-above:
        input: "5.5"
        output: "5.5"
      at-the-bound:
        input: "5"
        output: "5"
      below:
        input: "4"
        error: Expected number >= 5, received 4
