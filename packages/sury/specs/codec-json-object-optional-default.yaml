ts:
  schema: 'S.json.with(S.to, S.schema({ f: S.optional(S.string, "d") }))'
  input: JSON
  output: "{ f: string; }"
  instantiations: 5764
jsonSchema:
  # FIXME: under S.json a field the decode reads as absent (a default, `void`)
  # is still `required` here, because the input side is rendered from what
  # encode writes - so the document turns away a key the schema lets go missing.
  input: '{ type: "object", properties: { f: { type: "string" } }, additionalProperties: false, required: ["f"] }'
  fromInputType: "{ f: string; }"
  output: '{ type: "object", properties: { f: { type: "string" } }, required: ["f"] }'
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: (a,b)=>a===b||a.f===b.f
compare:
  input: "throws: [Sury] Can't compare JSON. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare { f: string; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="object"&&i&&!Array.isArray(i)||e[2](i);let v0=i.f;if(v0!==void 0){for(;;){if(typeof v0==="string")break;if(v0===null){v0="d";break}throw e[0](v0)}}else{for(;;){if(typeof v0==="string")break;if(v0===void 0){v0="d";break}throw e[1](v0)}}return {f:v0}}catch(v1){e[3](v1)}}
    examples:
      absent:
        input: "{}"
        output: '{ f: "d" }'
        divergence:
          reason: the input document is rendered from the encode side, which always writes the field
          ajv: "input: data must have required property 'f'"
      "null":
        input: "{ f: null }"
        output: '{ f: "d" }'
        divergence:
          reason: the input document is rendered from the encode side, which always writes the field
          ajv: "input: data/f must be string"
      string:
        input: '{ f: "x" }'
        output: '{ f: "x" }'
  decode: eq-to-parse
  encode:
    expression: i=>{try{let v0=i.f;typeof v0==="string"||e[0](v0);return i}catch(v1){e[1](v1)}}
    examples:
      value:
        input: '{ f: "x" }'
