    output: '{ anyOf: [{ type: "object", properties: { t: { type: "string", enum: ["y"] } }, required: ["t"] }, { type: "object", properties: { t: { type: "string", enum: ["z"] } }, required: ["t"] }] }'
isEqual:
  input: (a,b)=>a===b||(a.t==="a"?b.t==="a":b.t==="b")
  output: (a,b)=>a===b||(a.t==="y"?b.t==="y":b.t==="z")
compare:
  input: "throws: [Sury] Can't compare { t: \"a\"; } | { t: \"b\"; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare { t: \"y\"; } | { t: \"z\"; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
