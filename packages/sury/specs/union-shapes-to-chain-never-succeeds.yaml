# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.union([S.schema({ t: "a" }), S.schema({ t: "b" })]).with(S.to, S.schema({ t: S.string })).with(S.to, S.schema({ t: "x" })).with(S.to, S.union([S.schema({ t: "y" }), S.schema({ t: "z" })]))'
  input: '{ t: "a"; } | { t: "b"; }'
  output: '{ t: "y"; } | { t: "z"; }'
  instantiations: 11464
jsonSchema:
  input: '{ anyOf: [{ type: "object", properties: { t: { type: "string", const: "a" } }, additionalProperties: false, required: ["t"] }, { type: "object", properties: { t: { type: "string", const: "b" } }, additionalProperties: false, required: ["t"] }] }'
  output: "{ not: {} }"
  fromOutputType: never
  openapi-3.0:
    input: '{ anyOf: [{ type: "object", properties: { t: { type: "string", enum: ["a"] } }, additionalProperties: false, required: ["t"] }, { type: "object", properties: { t: { type: "string", enum: ["b"] } }, additionalProperties: false, required: ["t"] }] }'
isEqual:
  input: (a,b)=>a===b||(a.t==="a"?b.t==="a":b.t==="b")
  output: (a,b)=>a===b||(a.t==="y"?b.t==="y":b.t==="z")
compare:
  input: "throws: [Sury] Can't compare { t: \"a\"; } | { t: \"b\"; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare { t: \"y\"; } | { t: \"z\"; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{if(typeof i==="object"&&i&&!Array.isArray(i)){for(;;){if(i.t==="a"){let v0={t:"x"};for(;;){throw e[0](v0)}i=v0;break}if(i.t==="b"){let v1={t:"x"};for(;;){throw e[1](v1)}i=v1;break}throw e[2](i)}}else{throw e[2](i)}return i}catch(v2){e[3](v2)}}
    examples:
      # FIXME: should be refused when the operation is created, as the last link is met alone: no value passes, as on main
      a:
        input: '{ t: "a" }'
        error: 'Expected { t: "y"; } | { t: "z"; }, received { t: "x"; }'
  decode: eq-to-parse
  encode:
    expression: i=>{try{if(typeof i==="object"&&i&&!Array.isArray(i)){for(;;){if(i.t==="y"){let v0={t:"x"};for(;;){v0={t:"a"};break}i=v0;break}if(i.t==="z"){let v1={t:"x"};for(;;){v1={t:"a"};break}i=v1;break}throw e[0](i)}}else{throw e[0](i)}return i}catch(v2){e[1](v2)}}
    examples:
      y:
        input: '{ t: "y" }'
        output: '{ t: "a" }'
      other:
        input: '{ t: "q" }'
        error: 'Expected { t: "y"; } | { t: "z"; }, received { t: "q"; }'
