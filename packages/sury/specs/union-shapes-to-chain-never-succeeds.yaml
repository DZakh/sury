operations:
  parse:
    creationError: "SuryError: Can't decode { t: \"x\"; } -> { t: \"y\"; } | { t: \"z\"; }: it holds a value none of them does. Choose one with S.to, such as { t: \"x\"; } -> { t: \"y\"; }"
  decode: eq-to-parse
  encode:
    expression: i=>{try{if(typeof i==="object"&&i&&!Array.isArray(i)){for(;;){if(i.t==="y"){let v0={t:"x"};for(;;){v0={t:"a"};break}i=v0;break}if(i.t==="z"){let v1={t:"x"};for(;;){v1={t:"a"};break}i=v1;break}throw e[0](i)}}else{throw e[0](i)}return i}catch(v2){e[1](v2)}}
    examples:
      y:
        input: '{ t: "y" }'
        output: '{ t: "a" }'
      other:
        input: '{ t: "q" }'
        error: 'Expected { t: "y"; } | { t: "z"; }, received { t: "q"; }'
