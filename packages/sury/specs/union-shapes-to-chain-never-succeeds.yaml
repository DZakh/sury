  input: '{ t: "a"; } | { t: "b"; }'
  output: '{ t: "y"; } | { t: "z"; }'
  instantiations: 11464
jsonSchema:
  input: '{ anyOf: [{ type: "object", properties: { t: { type: "string", const: "a" } }, additionalProperties: false, required: ["t"] }, { type: "object", properties: { t: { type: "string", const: "b" } }, additionalProperties: false, required: ["t"] }] }'
  output: '{ anyOf: [{ type: "object", properties: { t: { type: "string", const: "y" } }, required: ["t"] }, { type: "object", properties: { t: { type: "string", const: "z" } }, required: ["t"] }] }'
