# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.union([S.never.with(S.to, S.number), S.string]))
  input: string
  output: string | number
  instantiations: 5662
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
  fromOutputType: string
isEqual: strictEqual
compare:
  input: strictCompare
  output: (a,b)=>a===b?0:(typeof a==="number"&&a==a?typeof b==="number"&&b==b?a<b?-1:a>b?1:0:-1:typeof b==="number"&&b==b?1:a<b?-1:a>b?1:0)
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      numeric-string-stays-string:
        input: '"123"'
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
  decode: identity
  encode:
    expression: i=>{for(;;){if(typeof i==="number"&&i==i){e[0](i);break}if(typeof i==="string")break;e[1](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
