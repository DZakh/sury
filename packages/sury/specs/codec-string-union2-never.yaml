# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.union([S.never.with(S.to, S.number), S.string]))
  input: string
  output: string | number
  instantiations: 6507
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
  fromOutputType: string
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      numeric-string-stays-string:
        input: '"123"'
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
  decode: identity
  encode:
    expression: i=>{for(;;){if(typeof i==="number"&&i===i){e[0](i);break;}if(typeof i==="string")break;e[1](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
