  input: string
  output: string
  instantiations: 254
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string", format: "relative-json-pointer" }'
  inputType: string
  output: '{ type: "string", format: "relative-json-pointer" }'
  outputType: string
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);e[0].test(i)||e[1](i);return i}
    examples:
      a-valid-upwards-rjp:
        input: '"1"'
        output: '"1"'
      a-valid-downwards-rjp:
        input: '"0/foo/bar"'
        output: '"0/foo/bar"'
      a-valid-up-and-then-down-rjp-with:
        input: '"2/0/baz/1/zip"'
        output: '"2/0/baz/1/zip"'
      a-valid-rjp-taking-the-member-or-index:
        input: '"0#"'
        output: '"0#"'
      an-invalid-rjp-that-is-a-valid-json:
        input: '"/foo/bar"'
