# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.jsonString, "pack")
  input: string
  output: string
  instantiations: 4388
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string", contentMediaType: "application/json" }'
  draft-2020-12:
    output: '{ type: "string", contentMediaType: "application/json", contentSchema: { type: "string" }, $schema: "https://json-schema.org/draft/2020-12/schema" }'
  openapi-3.0:
    output: '{ type: "string" }'
isEqual: strictEqual
compare: strictCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[1](i);return e[0](i)}catch(v0){e[2](v0)}}
    examples:
      the-string-is-a-value:
        input: '"hi"'
        output: '"\"hi\""'
      a-document-is-a-value-too:
        input: '"{\"a\":1}"'
        output: '"\"{\\\"a\\\":1}\""'
  decode:
    expression: i=>{return e[0](i)}
    examples:
      the-string-is-a-value:
        input: '"hi"'
        output: '"\"hi\""'
      a-document-is-a-value-too:
        input: '"{\"a\":1}"'
        output: '"\"{\\\"a\\\":1}\""'
  encode:
    expression: i=>{try{let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="string"||e[1](v0);return v0}catch(v1){e[2](v1)}}
    examples:
      the-string-is-a-value:
        input: '"\"hi\""'
        output: '"hi"'
      not-a-string-value:
        input: '"{\"a\":1}"'
        error: "Expected string, received { a: 1; }"
