    input: '{ anyOf: [{ items: { type: "number", enum: [1] }, type: "array" }, { type: "string" }] }'
    output: '{ anyOf: [{ items: { type: "number", enum: [2] }, type: "array" }, { type: "string" }] }'
isEqual: (a,b)=>a===b||(Array.isArray(a)?Array.isArray(b)&&e[0](a,b):typeof b==="string"&&a===b)
compare:
  input: "throws: [Sury] Can't compare 1[] | string. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare 2[] | string. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
