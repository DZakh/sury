# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.file.with(S.minSize, 3)
  input: File
  output: File
  instantiations: 5172
vs:
  zod: z.file().min(3)
jsonSchema:
  input: Expected JSON, received File.size >= 3
  output: Expected JSON, received File.size >= 3
operations:
  parse:
    expression: i=>{i instanceof e[1]||e[2](i);i.size>2||e[0](i);return i}
    examples:
      blob-is-not-a-file:
        input: new Blob(["abcd"])
        error: Expected File.size >= 3, received Blob
      # FIXME: a bound is the only refinement that rewrites the schema's type
      # expression, so it is the only one that shows up when the *type* check
      # is what failed — the size is named when nothing got far enough to have
      # one. Tracked against the length family in specs/string-minLength.yaml;
      # the fix covers both.
      wrong-type:
        input: '"abcd"'
        error: Expected File.size >= 3, received "abcd"
      wrong-type-null:
        input: "null"
        error: Expected File.size >= 3, received null
  decode:
    expression: i=>{i.size>2||e[0](i);return i}
    examples:
      under-the-size:
        input: new Blob(["ab"])
        error: Expected File.size >= 3, received Blob
  encode:
    expression: i=>{i.size>2||e[0](i);return i}
    examples:
      under-the-size:
        input: new Blob(["ab"])
        error: Expected File.size >= 3, received Blob
