# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.unknown.with(S.to, S.union([S.bigint, S.string]))
  input: unknown
  output: string | bigint
  instantiations: 5373
jsonSchema:
  input: "{}"
  fromInputType: JSON
  output: Expected JSON, received bigint | string
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: strictEqual
compare:
  input: "throws: [Sury] Can't compare unknown. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare bigint | string. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
