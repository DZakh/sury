# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.unknown.with(S.to, S.union([S.bigint, S.string]))
  input: unknown
  output: string | bigint
  instantiations: 5373
jsonSchema:
  input: "{}"
  fromInputType: JSON
  output: Expected JSON, received bigint | string
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{(typeof i==="bigint"||typeof i==="string")||e[0](i);return i}
    examples:
      bigint:
        input: 123n
        output: 123n
      string:
        input: '"abc"'
        output: '"abc"'
      numeric-string:
        input: '"123"'
        output: '"123"'
      invalid:
        input: "true"
        error: Expected bigint | string, received true
  decode: eq-to-parse
  encode: eq-to-parse
