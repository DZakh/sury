operations:
  parse:
    expression: i=>{try{(typeof i==="bigint"||typeof i==="string")||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      bigint:
        input: 123n
        output: 123n
      string:
        input: '"abc"'
        output: '"abc"'
      numeric-string:
        input: '"123"'
        output: '"123"'
