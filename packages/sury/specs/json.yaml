# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.json
  input: JSON
  output: JSON
  instantiations: 254
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: "{}"
  output: "{}"
operations:
  parse:
    expression: i=>{e[0](i);return i}
    examples:
      valid-object:
        input: '{ a: [1, "x", true, null] }'
        output: '{ a: [1, "x", true, null] }'
      valid-null:
        input: "null"
        output: "null"
      invalid-undefined:
        input: undefined
        error: Expected JSON, received undefined
      invalid-bigint:
        input: 5n
        error: Expected JSON, received 5n
      invalid-nan:
        input: NaN
        error: Expected JSON, received NaN
  decode: identity
  encode: identity
