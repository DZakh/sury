# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.string), S.string]))
  input: string | number
  output: string
  instantiations: 6666
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ type: "string" }'
operations:
  parse:
    expression: i=>{try{for(;;){if(typeof i==="number"&&!Number.isNaN(i)){i=""+i;break}if(typeof i==="string")break;e[0](i)}return i}catch(x){throw e[1](x,i)}}
    examples:
      number-decoded:
        input: "123"
        output: '"123"'
      string:
        input: '"abc"'
        output: '"abc"'
      float-decoded:
        input: "1.5"
        output: '"1.5"'
  decode: eq-to-parse
  encode:
    expression: i=>{try{for(;;){let r;if(typeof i==="string"){try{let v0=+i;!Number.isNaN(v0)||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break}e[2](i,...(r||[]))}return i}catch(x){throw e[3](x,i)}}
    examples:
      numeric-string:
        input: '"123"'
        output: "123"
      string:
        input: '"abc"'
        output: '"abc"'
