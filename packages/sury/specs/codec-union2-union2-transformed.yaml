# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.string), S.string]))
  input: string | number
  output: string
  instantiations: 6096
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ type: "string" }'
isEqual: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{for(;;){if(typeof i==="number"&&i==i){i=""+i;break}if(typeof i==="string")break;e[0](i)}return i}
    examples:
      number-decoded:
        input: "123"
        output: '"123"'
        divergence:
          reason: the checks compile the reverse direction, which this codec leaves ambiguous, so they raise on the schema instead of answering about the value
          check: Ambiguous number -> number | string. Should string be decoded or ignored? Choose with S.to for number -> string, or S.never -> string
      string:
        input: '"abc"'
        output: '"abc"'
        divergence:
          reason: the checks compile the reverse direction, which this codec leaves ambiguous, so they raise on the schema instead of answering about the value
          check: Ambiguous number -> number | string. Should string be decoded or ignored? Choose with S.to for number -> string, or S.never -> string
      float-decoded:
        input: "1.5"
        output: '"1.5"'
        divergence:
          reason: the checks compile the reverse direction, which this codec leaves ambiguous, so they raise on the schema instead of answering about the value
          check: Ambiguous number -> number | string. Should string be decoded or ignored? Choose with S.to for number -> string, or S.never -> string
  decode: eq-to-parse
  encode:
    expression: i=>{for(;;){let r;if(typeof i==="string"){try{let v0=+i;v0==v0&&(v0||i.trim())||e[0](i);i=v0;break}catch(x){(r||(r=[])).push(e[1](x))}break}e[2](i,...(r||[]))}return i}
    examples:
      numeric-string:
        input: '"123"'
        output: "123"
      string:
        input: '"abc"'
        output: '"abc"'
