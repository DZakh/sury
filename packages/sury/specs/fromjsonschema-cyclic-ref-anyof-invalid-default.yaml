operations:
  parse:
    expression: i=>{try{let v0;v0=e[0](i);return v0}catch(v1){e[1](v1)}}
    examples:
      # FIXME: a default beside a ref one level down in the union goes unchecked, so a value N | null rejects is set
      next-missing:
        input: "{ v: 2 }"
        output: '{ v: 2, next: "x" }'
        divergence:
          reason: the unchecked default is set though the output schema rejects it
          ajv: "output: data/next must be object, data/next must be null, data/next must match a schema in anyOf"
