# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.minLength, 1)
  input: string
  output: string
  instantiations: 789
jsonSchema:
  input: '{ type: "string", minLength: 1 }'
  output: '{ type: "string", minLength: 1 }'
isEqual: strictEqual
vs:
  zod: z.string().min(1)
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[1](i);i.length>0||e[0](i);return i}catch(v0){e[2](v0)}}
    examples:
      at-the-length:
        input: '"a"'
        output: '"a"'
      one-astral-code-point-two-units:
        input: '"😀"'
        output: '"😀"'
      two-code-points:
        input: '"ab"'
        output: '"ab"'
      empty:
        input: '""'
        error: Expected string.length >= 1, received ""
      wrong-type:
        input: "1"
        error: Expected string.length >= 1, received 1
  decode:
    expression: i=>{try{i.length>0||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      at-the-length:
        input: '"a"'
        output: '"a"'
      one-astral-code-point-two-units:
        input: '"😀"'
        output: '"😀"'
      two-code-points:
        input: '"ab"'
        output: '"ab"'
      empty:
        input: '""'
        error: Expected string.length >= 1, received ""
  encode:
    expression: i=>{try{i.length>0||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      at-the-length:
        input: '"a"'
        output: '"a"'
      one-astral-code-point-two-units:
        input: '"😀"'
        output: '"😀"'
      two-code-points:
        input: '"ab"'
        output: '"ab"'
      empty:
        input: '""'
        error: Expected string.length >= 1, received ""
