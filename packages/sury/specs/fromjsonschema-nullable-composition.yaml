# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ nullable: true, allOf: [{ type: "string" }, { minLength: 2 }] })'
  input: (string & JSON) | null
  output: (string & JSON) | null
  instantiations: 1244
jsonSchema:
  input: '{ anyOf: [{ type: "null" }, { allOf: [{ type: "string" }, { minLength: 2 }] }] }'
  output: '{ anyOf: [{ type: "null" }, { allOf: [{ type: "string" }, { minLength: 2 }] }] }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{for(;;){if(i===null)break;e[0](i);e[1](i)||e[2](i);break;}return i}
    examples:
      passes-both-members:
        input: '"ab"'
        output: '"ab"'
      null-skips-the-composition:
        input: "null"
        output: "null"
      fails-the-second-member:
        input: '"a"'
        error: Should pass for all schemas of the allOf property.
      fails-the-first-member:
        input: "1"
        error: Should pass for all schemas of the allOf property.
  decode: eq-to-parse
  encode: eq-to-parse
