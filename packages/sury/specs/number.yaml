# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.number
  input: number
  output: number
  instantiations: 254
jsonSchema:
  input: '{ type: "number" }'
  output: '{ type: "number" }'
isEqual: strictEqual
vs:
  zod: z.number()
operations:
  parse:
    expression: i=>{typeof i==="number"&&i==i||e[0](i);return i}
    examples:
      valid:
        input: "42.5"
        output: "42.5"
      valid-negative:
        input: "-1"
        output: "-1"
      valid-negative-zero:
        input: "-0"
        output: "-0"
      valid-infinity:
        input: Infinity
        output: Infinity
        divergence:
          reason: z.number() rejects the non-finite numbers; S.number takes them
          zod: "Invalid input: expected number, received number"
      valid-negative-infinity:
        input: -Infinity
        output: -Infinity
        divergence:
          reason: z.number() rejects the non-finite numbers; S.number takes them
          zod: "Invalid input: expected number, received number"
      invalid-nan:
        input: NaN
        error: Expected number, received NaN
      invalid-string:
        input: '"42"'
        error: Expected number, received "42"
  decode: identity
  encode: identity
