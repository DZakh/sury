ts:
  schema: 'S.union([S.union([S.string, S.number]).with(S.refine, (value) => value !== "", { error: "Expected a non-empty value" }), S.boolean])'
  input: string | number | boolean
  output: string | number | boolean
  instantiations: 6504
vs:
  zod: z.union([z.union([z.string(), z.number()]).refine((value) => value !== ""), z.boolean()])
jsonSchema:
  input: '{ anyOf: [{ anyOf: [{ type: "string" }, { type: "number" }] }, { type: "boolean" }] }'
  inputType: string | number | boolean
  output: '{ anyOf: [{ anyOf: [{ type: "string" }, { type: "number" }] }, { type: "boolean" }] }'
  outputType: string | number | boolean
operations:
  parse:
    expression: i=>{for(;;){if((typeof i==="string"||typeof i==="number"&&!Number.isNaN(i))){e[0](i)||e[1](i);break}if(typeof i==="boolean")break;e[2](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
      refined-away-empty-string:
        input: '""'
        error: Expected a non-empty value
      number:
        input: "5"
        output: "5"
      boolean-outer-member:
        input: "true"
        output: "true"
      invalid:
        input: "null"
