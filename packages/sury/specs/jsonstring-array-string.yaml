# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.array(S.string).with(S.to, S.jsonString)
  input: string[]
  output: string
  instantiations: 5472
jsonSchema:
  input: '{ items: { type: "string" }, type: "array" }'
  output: '{ type: "string", contentMediaType: "application/json" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{Array.isArray(i)||e[1](i);for(let v0=0;v0<i.length;++v0){try{let v1=i[v0];typeof v1==="string"||e[0](v1);}catch(v2){v2.path='["'+v0+'"]'+v2.path;throw v2}}return JSON.stringify(i)}
    examples:
      empty:
        input: "[]"
        output: '"[]"'
      escaping:
        input: '["say \"hi\"", "a\\nb", "\ud800"]'
        output: '"[\"say \\\"hi\\\"\",\"a\\\\nb\",\"\\ud800\"]"'
      invalid-item:
        input: '["a", 1]'
        error: 'Failed at ["1"]: Expected string, received 1'
  decode:
    expression: i=>{return JSON.stringify(i)}
    examples:
      escaping:
        input: '["say \"hi\"", "a\\nb"]'
        output: '"[\"say \\\"hi\\\"\",\"a\\\\nb\"]"'
  encode:
    expression: i=>{let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}Array.isArray(v0)||e[2](v0);for(let v1=0;v1<v0.length;++v1){try{let v2=v0[v1];typeof v2==="string"||e[1](v2);}catch(v3){v3.path='["'+v1+'"]'+v3.path;throw v3}}return v0}
    examples:
      escaping:
        input: '"[\"say \\\"hi\\\"\",\"a\\\\nb\"]"'
        output: '["say \"hi\"", "a\\nb"]'
