# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.jsonString
  input: string
  output: string
  instantiations: 254
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);try{JSON.parse(i)}catch(t){e[0](i)}return i}
    examples:
      valid-json-number-text:
        input: '"123"'
        output: '"123"'
      valid-json-object-text:
        input: '"{\"foo\":[1,2]}"'
        output: '"{\"foo\":[1,2]}"'
      invalid-json-text:
        input: '"{"'
        error: Expected JSON string, received "{"
      not-a-string:
        input: "123"
        error: Expected JSON string, received 123
  decode: identity
  encode: identity
