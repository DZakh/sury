      one:
        input: "1"
        output: "1"
        divergence:
          reason: the checks meet 2 with the whole of 1 | "x" rather than with 1 alone, so they raise on the schema instead of answering about the value
          check: Ambiguous 2 -> 1 | "x". Should "x" be decoded or ignored? Choose with S.to for 2 -> "x", or S.never -> "x"
