ts:
  schema: S.union([1, 2, "x"]).with(S.to, S.union([1, "x"]))
  input: 1 | 2 | "x"
  output: 1 | "x"
  instantiations: 5096
jsonSchema:
  input: '{ enum: [1, "x"] }'
  fromInputType: 1 | "x"
  output: '{ anyOf: [{ type: "number", const: 1 }, { not: {} }, { type: "string", const: "x" }] }'
  openapi-3.0:
    output: '{ anyOf: [{ type: "number", enum: [1] }, { not: {} }, { type: "string", enum: ["x"] }] }'
isEqual: strictEqual
compare:
  input: "throws: [Sury] Can't compare 1 | 2 | \"x\". Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare 1 | \"x\". Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
