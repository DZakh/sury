operations:
  parse:
    expression: i=>{try{for(;;){if(typeof i==="number"&&i==i){for(;;){if(i===1)break;if(i===2){for(;;){throw e[0](i)}break}throw e[1](i)}break}if(typeof i==="string"&&i==="x")break;throw e[1](i)}return i}catch(v0){e[2](v0)}}
