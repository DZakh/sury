# yaml-language-server: $schema=./spec.schema.json
ts:
  # FIXME: Codec next expects: stay the same — rule 4 passes both variants through,
  # never coercing "123" to a number.
  schema: S.union([S.string, S.number]).with(S.to, S.union([S.number, S.string]))
  input: string | number
  output: string | number
  instantiations: 6196
vs:
  zod: z.union([z.string(), z.number()])
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
operations:
  parse:
    expression: i=>{if(!(typeof i==="string"||typeof i==="number"&&!Number.isNaN(i))){e[0](i)}return i}
    examples:
      string-never-coerced:
        input: '"123"'
        output: '"123"'
      number:
        input: "123"
        output: "123"
      invalid:
        input: "true"
        error: Expected string | number, received true
      nan-rejected:
        input: NaN
        error: Expected string | number, received NaN
      negative-zero:
        input: "-0"
        output: "-0"
  decode: eq-to-parse
  encode:
    expression: i=>{if(!(typeof i==="number"&&!Number.isNaN(i)||typeof i==="string")){e[0](i)}return i}
    examples:
      string:
        input: '"123"'
        output: '"123"'
      number:
        input: "123"
        output: "123"
