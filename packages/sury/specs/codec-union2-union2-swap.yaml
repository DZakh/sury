# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.string, S.number]).with(S.to, S.union([S.number, S.string]))
  input: string | number
  output: string | number
  instantiations: 5510
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
isEqual: strictEqual
compare:
  input: "throws: [Sury] Can't compare string | number. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare number | string. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod: z.union([z.string(), z.number()])
operations:
  parse:
    expression: i=>{try{(typeof i==="string"||typeof i==="number"&&i==i)||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      string-never-coerced:
        input: '"123"'
        output: '"123"'
      number:
        input: "123"
        output: "123"
      invalid:
        input: "true"
        error: Expected string | number, received true
      nan-rejected:
        input: NaN
        error: Expected string | number, received NaN
      negative-zero:
        input: "-0"
        output: "-0"
  decode: eq-to-parse
  encode:
    expression: i=>{try{(typeof i==="number"&&i==i||typeof i==="string")||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      string:
        input: '"123"'
        output: '"123"'
      number:
        input: "123"
        output: "123"
