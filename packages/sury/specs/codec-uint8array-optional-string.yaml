# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.uint8Array.with(S.to, S.optional(S.string))
  input: Uint8Array<ArrayBufferLike>
  output: string | undefined
  instantiations: 4753
jsonSchema:
  input: Expected JSON, received Uint8Array
  output: '{ type: "string" }'
  fromOutputType: string
isEqual:
  input: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
  output: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{i instanceof e[1]||e[2](i);let v0=e[0].decode(i);i=v0;return i}
    examples:
      base64-legal-ascii:
        input: new Uint8Array([97, 98, 99, 100])
        output: '"abcd"'
      utf8-bytes:
        input: new Uint8Array([226, 130, 172])
        output: '"€"'
  decode:
    expression: i=>{let v0=e[0].decode(i);i=v0;return i}
    examples:
      base64-legal-ascii:
        input: new Uint8Array([97, 98, 99, 100])
        output: '"abcd"'
  encode:
    expression: i=>{if(typeof i==="string"){i=e[0](i)}else{e[1](i)}return i}
    examples:
      text:
        input: '"abcd"'
        output: new Uint8Array([97, 98, 99, 100])
