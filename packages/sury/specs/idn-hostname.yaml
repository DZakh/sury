        input: '"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
        output: '"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
      a-single-label-of-64-characters-is-too:
        input: '"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
        error: Expected idn-hostname, received "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      invalid-label-correct-punycode:
        input: '"-> $1.00 <--"'
        error: Expected idn-hostname, received "-> $1.00 <--"
      valid-chinese-punycode:
        input: '"xn--ihqwcrb4cv8a8dqg056pqjye"'
        output: '"xn--ihqwcrb4cv8a8dqg056pqjye"'
