# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.noValidation, true).with(S.to, S.uint8Array)
  input: string
  output: Uint8Array<ArrayBufferLike>
  instantiations: 4875
jsonSchema:
  input: '{ type: "string" }'
  output: Expected JSON, received Uint8Array
isEqual:
  input: strictEqual
  output: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{return e[0](i)}
    examples:
      text:
        input: '"€"'
        output: new Uint8Array([226, 130, 172])
  decode: eq-to-parse
  encode:
    expression: i=>{let v0=e[0].decode(i);return v0}
    examples:
      utf8-bytes:
        input: new Uint8Array([226, 130, 172])
        output: '"€"'
      lossy-bytes:
        input: new Uint8Array([137, 80, 78, 71])
        output: '"�PNG"'
