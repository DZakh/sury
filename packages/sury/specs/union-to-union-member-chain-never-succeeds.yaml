ts:
  schema: S.union([S.literal("x"), S.number]).with(S.to, S.union([S.literal("x").with(S.to, S.union(["y", "z"])), S.number]))
  input: number | "x"
  output: number | "y" | "z"
  instantiations: 6324
jsonSchema:
  input: '{ anyOf: [{ type: "string", const: "x" }, { type: "number" }] }'
  output: '{ anyOf: [{ not: {} }, { type: "number" }] }'
  fromOutputType: number
  openapi-3.0:
    input: '{ anyOf: [{ type: "string", enum: ["x"] }, { type: "number" }] }'
isEqual: strictEqual
compare:
  input: "throws: [Sury] Can't compare \"x\" | number. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare \"y\" | \"z\" | number. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{for(;;){if(typeof i==="string"&&i==="x"){for(;;){throw e[0](i)}break}if(typeof i==="number"&&i==i)break;throw e[1](i)}return i}catch(v0){e[2](v0)}}
    examples:
      # FIXME: should be refused when the operation is created, as the last link is met alone: no value passes, as on main
      x:
        input: '"x"'
        error: Expected "y" | "z", received "x"
      number:
        input: "1"
        output: "1"
  decode: eq-to-parse
  encode:
    expression: i=>{try{let v0;for(;;){if(typeof i==="number"&&i==i)break;l1:{if(typeof i==="string"){for(;;){if(i==="y"){i="x";break}if(i==="z"){i="x";break}v0=[v0,e[0](i)];break l1}}else{v0=[v0,e[0](i)];break l1}break}throw e[1](i,v0)}return i}catch(v2){e[2](v2)}}
    examples:
      y:
        input: '"y"'
        output: '"x"'
      number:
        input: "1"
        output: "1"
      other:
        input: '"x"'
        error: |-
          Expected "y" | "z" | number, received "x"
          - Expected "y" | "z", received "x"
