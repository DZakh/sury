# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ $ref: "#/$defs/Node", $defs: { Node: { type: "object", properties: { name: { type: "string" }, children: { type: "array", items: { $ref: "#/$defs/Node" } } }, required: ["name", "children"] } } })'
  input: JSON
  output: JSON
  instantiations: 254
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ $ref: "#/$defs/Node", $defs: { Node: { type: "object", properties: { name: { type: "string" }, children: { items: { $ref: "#/$defs/Node" }, type: "array" } }, required: ["name", "children"] } } }'
  output: '{ $ref: "#/$defs/Node", $defs: { Node: { type: "object", properties: { name: { type: "string" }, children: { items: { $ref: "#/$defs/Node" }, type: "array" } }, required: ["name", "children"] } } }'
operations:
  parse:
    expression: i=>{let v0;v0=e[0](i);return v0}
    examples:
      leaf:
        input: '{ name: "a", children: [] }'
        output: '{ name: "a", children: [] }'
      nested:
        input: '{ name: "a", children: [{ name: "b", children: [] }] }'
        output: '{ name: "a", children: [{ name: "b", children: [] }] }'
      deeply-nested:
        input: '{ name: "a", children: [{ name: "b", children: [{ name: "c", children: [] }] }] }'
        output: '{ name: "a", children: [{ name: "b", children: [{ name: "c", children: [] }] }] }'
      wrong-type-at-depth:
        input: '{ name: "a", children: [{ name: 1, children: [] }] }'
        error: 'Failed at ["children"]["0"]["name"]: Expected string, received 1'
      missing-required-at-depth:
        input: '{ name: "a", children: [{ name: "b" }] }'
        error: 'Failed at ["children"]["0"]["children"]: Expected Node[], received undefined'
      not-an-object:
        input: '"a"'
        error: 'Expected { name: string; children: Node[]; }, received "a"'
  decode: eq-to-parse
  encode: eq-to-parse
