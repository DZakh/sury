# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.jsonString, "unpack")
  input: string
  output: string
  instantiations: 4388
jsonSchema:
  input: '{ type: "string", contentMediaType: "application/json" }'
  output: '{ type: "string", contentMediaType: "application/json" }'
  draft-2020-12:
    output: '{ type: "string", contentMediaType: "application/json", contentSchema: { type: "string" }, $schema: "https://json-schema.org/draft/2020-12/schema" }'
  openapi-3.0:
    input: '{ type: "string" }'
    output: '{ type: "string" }'
isEqual: strictEqual
compare: strictCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);try{JSON.parse(i)}catch(t){e[0](i)}return i}
    examples:
      the-text-is-the-document:
        input: '"{\"a\":1}"'
        output: '"{\"a\":1}"'
      not-a-document:
        input: '"nope"'
        error: Expected JSON string, received "nope"
  decode:
    expression: i=>{try{JSON.parse(i)}catch(t){e[0](i)}return i}
    examples:
      the-text-is-the-document:
        input: '"{\"a\":1}"'
        output: '"{\"a\":1}"'
      not-a-document:
        input: '"nope"'
        error: Expected JSON string, received "nope"
  encode: identity
