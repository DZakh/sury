# yaml-language-server: $schema=./spec.schema.json
ts:
  # FIXME: Codec next expects: rejected at creation — rule 4 matches by exact type and
  # S.json is neither the string nor the number type.
  schema: S.union([S.string, S.number, S.bigint]).with(S.to, S.union([S.json, S.bigint]))
  input: string | number | bigint
  output: bigint | JSON
  instantiations: 6901
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: Expected JSON, received string | number | bigint
  output: Expected JSON, received JSON | bigint
operations:
  parse:
    expression: i=>{if(!(typeof i==="string"||typeof i==="number"&&!Number.isNaN(i)||typeof i==="bigint")){e[1](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
      number:
        input: "123"
        output: "123"
      bigint:
        input: 123n
        output: 123n
  decode: eq-to-parse
  encode:
    expression: i=>{try{if(typeof i==="string"){let v0;try{v0=BigInt(i)}catch(_){e[0](i)}i=v0}else if(!(typeof i==="string"||typeof i==="number"&&!Number.isNaN(i))){e[1](i)}}catch(e0){if(!(typeof i==="bigint")){e[2](i,e0)}}return i}
    examples:
      json-string:
        input: '"abc"'
        error: |-
          Expected JSON | bigint, received "abc"
          - Expected bigint, received "abc"
      bigint:
        input: 123n
        output: 123n
