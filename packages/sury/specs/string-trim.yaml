# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.trim(S.string)
  aliases:
    - S.string.with(S.trim)
  input: string
  output: string
  instantiations: 330
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
isEqual: strictEqual
vs:
  zod: z.string().trim()
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[2](i);let v0;try{v0=e[0](i)}catch(x){e[1](x)}return v0}catch(v1){e[3](v1)}}
    examples:
      leading-whitespace:
        input: '"  123"'
        output: '"123"'
      already-trimmed:
        input: '"123"'
        output: '"123"'
      not-a-string:
        input: "1"
        error: Expected string, received 1
  decode:
    expression: i=>{try{let v0;try{v0=e[0](i)}catch(x){e[1](x)}return v0}catch(v1){e[2](v1)}}
    examples:
      leading-whitespace:
        input: '"  123"'
        output: '"123"'
  encode:
    expression: i=>{try{let v0;try{v0=e[0](i)}catch(x){e[1](x)}return v0}catch(v1){e[2](v1)}}
    examples:
      valid:
        input: '"123"'
        output: '"123"'
