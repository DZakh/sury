# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.empty)
  input: string
  output: string
  instantiations: 533
vs:
  zod: z.string().length(0)
jsonSchema:
  input: '{ type: "string", minLength: 0, maxLength: 0 }'
  output: '{ type: "string", minLength: 0, maxLength: 0 }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);i.length===0||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        error: String must be exactly 0 characters long
      longer:
        input: '"abc"'
        error: String must be exactly 0 characters long
      shorter:
        input: '"a"'
        error: String must be exactly 0 characters long
      empty:
        input: '""'
        output: '""'
      single-space:
        input: '" "'
        error: String must be exactly 0 characters long
      wrong-type:
        input: "1"
        error: Expected string, received 1
  decode:
    expression: i=>{i.length===0||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        error: String must be exactly 0 characters long
      shorter:
        input: '"a"'
        error: String must be exactly 0 characters long
      empty:
        input: '""'
        output: '""'
  encode:
    expression: i=>{i.length===0||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        error: String must be exactly 0 characters long
      shorter:
        input: '"a"'
        error: String must be exactly 0 characters long
      empty:
        input: '""'
        output: '""'
