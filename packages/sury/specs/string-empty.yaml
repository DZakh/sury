# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.empty)
  input: string
  output: string
  instantiations: 534
vs:
  zod: z.string().length(0)
jsonSchema:
  input: '{ type: "string", minLength: 0, maxLength: 0 }'
  output: '{ type: "string", minLength: 0, maxLength: 0 }'
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[1](i);i.length===0||e[0](i);return i}catch(x){throw e[2](x,i)}}
    examples:
      at-the-length:
        input: '"ab"'
        error: Expected string.length == 0, received "ab"
      longer:
        input: '"abc"'
        error: Expected string.length == 0, received "abc"
      shorter:
        input: '"a"'
        error: Expected string.length == 0, received "a"
      empty:
        input: '""'
        output: '""'
      single-space:
        input: '" "'
        error: Expected string.length == 0, received " "
      wrong-type:
        input: "1"
        error: Expected string.length == 0, received 1
  decode:
    expression: i=>{try{i.length===0||e[0](i);return i}catch(x){throw e[1](x,i)}}
    examples:
      at-the-length:
        input: '"ab"'
        error: Expected string.length == 0, received "ab"
      shorter:
        input: '"a"'
        error: Expected string.length == 0, received "a"
      empty:
        input: '""'
        output: '""'
  encode:
    expression: i=>{try{i.length===0||e[0](i);return i}catch(x){throw e[1](x,i)}}
    examples:
      at-the-length:
        input: '"ab"'
        error: Expected string.length == 0, received "ab"
      shorter:
        input: '"a"'
        error: Expected string.length == 0, received "a"
      empty:
        input: '""'
        output: '""'
