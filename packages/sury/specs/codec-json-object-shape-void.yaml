# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.json.with(S.to, S.schema({ a: S.shape(S.schema(undefined), () => "x") }))'
  input: JSON
  output: "{ a: string; }"
  instantiations: 5774
jsonSchema:
  # FIXME: under S.json a field the decode reads as absent (a default, `void`)
  # is still `required` here, because the input side is rendered from what
  # encode writes - so the document turns away a key the schema lets go missing.
  input: '{ type: "object", properties: { a: { type: "null" } }, additionalProperties: false, required: ["a"] }'
  fromInputType: "{ a: null; }"
  output: '{ type: "object", properties: { a: { type: "string", const: "x" } }, required: ["a"] }'
  fromOutputType: '{ a: "x"; }'
  openapi-3.0:
    input: '{ type: "object", properties: { a: { enum: [null] } }, additionalProperties: false, required: ["a"] }'
    output: '{ type: "object", properties: { a: { type: "string", enum: ["x"] } }, required: ["a"] }'
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: alwaysEqual
compare:
  input: "throws: [Sury] Can't compare JSON. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare { a: \"x\"; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="object"&&i&&!Array.isArray(i)||e[1](i);let v0=i.a;if(v0!==void 0){v0===null||e[0](v0);v0="x";}else{v0="x";}return {a:v0}}catch(v1){e[2](v1)}}
    examples:
      absent:
        input: "{}"
        output: '{ a: "x" }'
        divergence:
          reason: the input document is rendered from the encode side, which always writes the field
          ajv: "input: data must have required property 'a'"
  decode: eq-to-parse
  encode:
    expression: i=>{return {a:null}}
    examples:
      value:
        input: '{ a: "x" }'
        output: "{ a: null }"
