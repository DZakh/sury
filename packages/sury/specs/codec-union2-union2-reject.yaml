# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.never), S.string]))
  input: string | number
  output: string
  instantiations: 6742
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: '{ anyOf: [{ not: {} }, { type: "string" }] }'
operations:
  parse:
    expression: i=>{if(typeof i==="number"&&!Number.isNaN(i)){e[0](i);}else if(!(typeof i==="string")){e[1](i)}return i}
    examples:
      rejected-number:
        input: "42"
        error: Expected never, received 42
      preserved-string:
        input: '"ok"'
        output: '"ok"'
  decode: eq-to-parse
  encode:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      string:
        input: '"ok"'
        output: '"ok"'
      rejected-number:
        input: "42"
        error: Expected never | string, received 42
