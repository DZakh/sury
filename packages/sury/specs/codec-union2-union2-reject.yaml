# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.never), S.string]))
  input: string | number
  output: string
  instantiations: 6728
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ type: "string" }'
operations:
  parse:
    expression: i=>{for(;;){if(typeof i==="number"&&!Number.isNaN(i)){e[0](i);break}if(typeof i==="string")break;e[1](i)}return i}
    examples:
      rejected-number:
        input: "42"
        error: Expected never, received 42
      preserved-string:
        input: '"ok"'
        output: '"ok"'
  decode: eq-to-parse
  encode:
    creationError: "SuryError: Invalid operation: can't convert never | string to number | string — number has no same-type variant on the other side. Use S.to to say what you mean, or S.never to mark a variant unreachable"
