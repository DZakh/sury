# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.never), S.string]))
  input: string | number
  output: string
  instantiations: 6742
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "string" }'
  output: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
operations:
  parse:
    expression: i=>{if(typeof i==="number"&&!Number.isNaN(i)){e[0](i);}else if(!(typeof i==="string")){e[1](i)}return i}
    examples:
      number-rejected:
        input: "123"
        error: Expected never, received 123
      string:
        input: '"abc"'
        output: '"abc"'
  decode: eq-to-parse
  encode:
    expression: i=>{if(!(typeof i==="string")){e[0](i)}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
