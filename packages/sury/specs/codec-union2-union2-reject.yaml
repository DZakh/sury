# yaml-language-server: $schema=./spec.schema.json
ts:
  # FIXME: Codec next expects: stay the same — the explicit S.never target variant is
  # how rule 3's partial match is resolved into rejecting numbers.
  schema: S.union([S.number, S.string]).with(S.to, S.union([S.number.with(S.to, S.never), S.string]))
  input: string | number
  output: string
  instantiations: 6742
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
operations:
  parse:
    expression: i=>{if(typeof i==="number"&&!Number.isNaN(i)){try{e[0](i);}catch(e0){e[1](i,e0)}}else if(!(typeof i==="string")){e[2](i)}return i}
    examples:
      number-rejected:
        input: "123"
        error: |-
          Expected number | string, received 123
          - Expected never, received 123
      string:
        input: '"abc"'
        output: '"abc"'
  decode: eq-to-parse
  encode:
    expression: i=>{try{e[0](i);}catch(e0){if(!(typeof i==="string")){e[1](i,e0)}}return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
