# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([1, S.literal(2).with(S.to, S.literal(1))]).with(S.to, S.literal(1))
  input: 1 | 2
  output: "1"
  instantiations: 5487
jsonSchema:
  input: '{ type: "number", const: 1 }'
  fromInputType: "1"
  output: '{ type: "number", const: 1 }'
  openapi-3.0:
    input: '{ type: "number", enum: [1] }'
    output: '{ type: "number", enum: [1] }'
isEqual:
  input: strictEqual
  output: alwaysEqual
compare:
  input: strictCompare
  output: alwaysCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{if(typeof i==="number"&&i==i){for(;;){if(i===1)break;if(i===2){i=1;break}throw e[0](i)}}else{throw e[0](i)}return i}catch(v0){e[1](v0)}}
    examples:
      one:
        input: "1"
        output: "1"
      # FIXME: the input document is what encode writes, not what parse reads, as on main for S.union([S.string, S.number.with(S.to, S.string)]).with(S.to, S.string): it holds only 1, so a consumer validating with it turns away the 2 the union converts
      two:
        input: "2"
        output: "1"
        divergence:
          reason: the input document is the target's, which names only 1
          ajv: "input: data must be equal to constant"
  decode: eq-to-parse
  encode:
    expression: i=>{try{i===1||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      one:
        input: "1"
        output: "1"
