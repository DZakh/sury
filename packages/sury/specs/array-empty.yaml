# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.array(S.string).with(S.length, 0)
  input: "[]"
  output: "[]"
  instantiations: 1030
jsonSchema:
  input: '{ items: { type: "string" }, type: "array", minItems: 0, maxItems: 0 }'
  output: '{ items: { type: "string" }, type: "array", minItems: 0, maxItems: 0 }'
isEqual: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
vs:
  zod:
    schema: z.array(z.string()).length(0)
    divergence: "`S.empty` pins the Sury type to exactly `[]` where Zod keeps the unbounded `string[]`."
    input: string[]
    output: string[]
operations:
  parse:
    expression: i=>{try{Array.isArray(i)||e[2](i);for(let v0=0;v0<i.length;++v0){try{let v1=i[v0];typeof v1==="string"||e[0](v1);}catch(v2){v2.path=[v0,...v2.path];throw v2}}i.length===0||e[1](i);return i}catch(v3){e[3](v3)}}
    examples:
      at-the-length:
        input: '["a", "b"]'
        error: Expected string[].length == 0, received ["a", "b"]
      longer:
        input: '["a", "b", "c"]'
        error: Expected string[].length == 0, received ["a", "b", "c"]
      shorter:
        input: '["a"]'
        error: Expected string[].length == 0, received ["a"]
      empty:
        input: "[]"
        output: "[]"
      wrong-type:
        input: '"ab"'
        error: Expected string[].length == 0, received "ab"
  decode:
    expression: i=>{try{i.length===0||e[0](i);return i}catch(v1){e[1](v1)}}
