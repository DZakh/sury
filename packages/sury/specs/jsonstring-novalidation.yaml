# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.noValidation(S.json, true).with(S.to, S.jsonString)
  input: JSON
  output: string
  instantiations: 5350
jsonSchema:
  input: "{}"
  output: '{ type: "string", contentMediaType: "application/json" }'
  openapi-3.0:
    output: '{ type: "string" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{return JSON.stringify(i)}
    examples:
      object:
        input: "{ a: 1 }"
        output: '"{\"a\":1}"'
      non-json-skips-declared-string-output:
        input: undefined
        output: undefined
  decode: eq-to-parse
  encode: identity
