# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.json.with(S.to, S.url)
  input: JSON
  output: URL
  instantiations: 4430
jsonSchema:
  input: '{ type: "string", format: "uri" }'
  fromInputType: string
  output: Expected JSON, received URL
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: (a,b)=>a===b||a.href===b.href
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="string"||e[2](i);let v0=e[0](i);v0||e[1](i);return v0}catch(v1){e[3](v1)}}
    examples:
      valid:
        input: '"http://dzakh.dev/"'
        output: new URL("http://dzakh.dev/")
      invalid-no-scheme:
        input: '"cifjhdsfhsd"'
        error: Expected URL, received "cifjhdsfhsd"
      invalid-not-a-string:
        input: "123"
        error: Expected string, received 123
  decode: eq-to-parse
  encode:
    expression: i=>{try{return e[0](i)}catch(v0){e[1](v0)}}
    examples:
      valid:
        input: new URL("http://dzakh.dev/")
        output: '"http://dzakh.dev/"'
      escapes-to-stay-a-uri:
        input: new URL("http://ex.com/a|b")
        output: '"http://ex.com/a%7Cb"'
