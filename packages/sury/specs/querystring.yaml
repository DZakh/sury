# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.queryString
  input: string
  output: string
  instantiations: 254
jsonSchema:
  input: '{ type: "string" }'
  output: '{ type: "string" }'
isEqual: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      valid:
        input: '"q=hi&page=2"'
        output: '"q=hi&page=2"'
      empty:
        input: '""'
        output: '""'
      number:
        input: "1"
        error: Expected query string, received 1
  decode: identity
  encode: identity
