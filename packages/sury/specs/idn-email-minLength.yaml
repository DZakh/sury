    expression: i=>{typeof i==="string"||e[3](i);e[0].test(i)||e[1](i);i.length>4||e[2](i);return i}
    examples:
      astral-local-part:
        input: '"😀😀@x.y"'
        output: '"😀😀@x.y"'
      bmp:
        input: '"ab@x.y"'
        output: '"ab@x.y"'
      shorter:
        input: '"a@b"'
        error: Expected idn-email.length >= 5, received "a@b"
