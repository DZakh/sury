# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ type: "string", minLength: 2, anyOf: [{ pattern: "^a" }, { pattern: "z$" }] })'
  input: string
  output: string
  instantiations: 755
jsonSchema:
  input: '{ type: "string", minLength: 2, anyOf: [{ pattern: "^a" }, { pattern: "z$" }] }'
  output: '{ type: "string", minLength: 2, anyOf: [{ pattern: "^a" }, { pattern: "z$" }] }'
isEqual: strictEqual
vs:
  zod: z.string()
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);e[0](i)||e[3](i);i.length>1||e[1](i);return i}
    examples:
      starts-with-a:
        input: '"ab"'
        output: '"ab"'
      ends-with-z:
        input: '"zz"'
        output: '"zz"'
      too-short:
        input: '"a"'
        error: Expected string.length >= 2, received "a"
        divergence:
          reason: the equivalent is a plain z.string(), the only spelling zod has for this document, so it accepts every value the refinements reject
          zod: '"a"'
      neither-branch:
        input: '"bb"'
        error: Should pass at least one schema according to the anyOf property.
        divergence:
          reason: the equivalent is a plain z.string(), the only spelling zod has for this document, so it accepts every value the refinements reject
          zod: '"bb"'
  decode:
    expression: i=>{e[0](i)||e[2](i);i.length>1||e[1](i);return i}
    examples:
      starts-with-a:
        input: '"ab"'
        output: '"ab"'
  encode:
    expression: i=>{i.length>1||e[2](i);e[0](i)||e[1](i);return i}
    examples:
      starts-with-a:
        input: '"ab"'
        output: '"ab"'
