# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ type: "array", prefixItems: [{ type: "string" }, { type: "number" }], items: false })'
  input: "[(string | undefined)?, (number | undefined)?, ...never[]]"
  output: "[(string | undefined)?, (number | undefined)?, ...never[]]"
  instantiations: 1107
jsonSchema:
  # FIXME: the default target is draft-07, where `prefixItems` means nothing and
  # `items: false` forbids every item - so this document rejects every non-empty
  # array the schema itself accepts (the `divergence` entries below). The two
  # keywords are carried over from the source document rather than re-emitted
  # for the target, the way S.tuple's positional items are.
  input: '{ items: false, type: "array", prefixItems: [{ type: "string" }, { type: "number" }] }'
  output: '{ items: false, type: "array", prefixItems: [{ type: "string" }, { type: "number" }] }'
isEqual: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(e[0](a[i],b[i])))return false;return true}
vs:
  zod:
    schema: z.tuple([z.string().optional(), z.number().optional()])
    divergence: Zod prints the closed tuple without Sury's equivalent never rest.
    input: "[(string | undefined)?, (number | undefined)?]"
    output: "[(string | undefined)?, (number | undefined)?]"
operations:
  parse:
    expression: i=>{Array.isArray(i)||e[2](i);e[1](i)||e[3](i);for(let v0=0;v0<i.length;++v0){try{e[0](i[v0]);}catch(v1){v1.path=[v0,...v1.path];throw v1}}return i}
    examples:
      empty:
        input: "[]"
        output: "[]"
      first-only:
        input: '["a"]'
        output: '["a"]'
        divergence:
          reason: "the default draft-07 target has no prefixItems, so the emitted `items: false` rejects every non-empty array the schema accepts"
          ajv: "input: data/0 boolean schema is false; output: data/0 boolean schema is false"
      full-prefix:
        input: '["a", 1]'
        output: '["a", 1]'
        divergence:
          reason: "the default draft-07 target has no prefixItems, so the emitted `items: false` rejects every non-empty array the schema accepts"
          ajv: "input: data/0 boolean schema is false; output: data/0 boolean schema is false"
      additional-item-rejected:
        input: '["a", 1, true]'
        error: Should pass the positional and additional item schemas.
      wrong-prefix-item:
        input: '["a", "1"]'
        error: Should pass the positional and additional item schemas.
  decode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      empty:
        input: "[]"
        output: "[]"
      first-only:
        input: '["a"]'
        output: '["a"]'
      full-prefix:
        input: '["a", 1]'
        output: '["a", 1]'
      additional-item-rejected:
        input: '["a", 1, true]'
        error: Should pass the positional and additional item schemas.
  encode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      empty:
        input: "[]"
        output: "[]"
      first-only:
        input: '["a"]'
        output: '["a"]'
      full-prefix:
        input: '["a", 1]'
        output: '["a", 1]'
      additional-item-rejected:
        input: '["a", 1, true]'
        error: Should pass the positional and additional item schemas.
