# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: "S.formData.with(S.to, S.schema({ a: S.string, n: S.number.with(S.gte, 18) }))"
  input: FormData
  output: "{ a: string; n: number; }"
  instantiations: 6128
jsonSchema:
  input: Expected JSON, received FormData
  output: '{ type: "object", properties: { a: { type: "string" }, n: { type: "number", minimum: 18 } }, required: ["a", "n"] }'
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: (a,b)=>a===b||a.a===b.a&&a.n===b.n
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    creationError: 'SuryError: Failed at a: Ambiguous "" for string. Should a blank input be rejected, kept, or read as absent? Choose with S.nonEmpty, S.minLength(0), or S.optional'
  decode: eq-to-parse
  encode:
    expression: i=>{let v0=i.n;v0>=18||e[0](v0);let v1=new e[1]();v1.append("a",i.a);v1.append("n",""+v0);return v1}
    examples:
      built:
        input: '{ a: "x", n: 42 }'
        output: ((f) => (f.append("a", "x"), f.append("n", "42"), f))(new FormData())
      too-young:
        input: '{ a: "x", n: 7 }'
        error: "Failed at n: Expected number >= 18, received 7"
