# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.any.with(S.to, S.number, { decode: "auto", encode: (value) => value })'
  input: any
  output: number
  instantiations: 4490
jsonSchema:
  input: "{}"
  output: '{ type: "number" }'
isEqual:
  input: (a,b)=>a===b||e[0](a,b)
  output: strictEqual
compare:
  input: "throws: [Sury] Can't compare unknown. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: strictCompare
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="number"&&i==i||e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      validating-downcast:
        input: "5"
        output: "5"
      rejects-non-number:
        input: '"abc"'
        error: Expected number, received "abc"
  decode: eq-to-parse
  encode:
    expression: i=>{try{let v0;try{v0=e[0](i)}catch(x){e[1](x)}return v0}catch(v1){e[2](v1)}}
    examples:
      custom-upcast:
        input: "5"
        output: "5"
