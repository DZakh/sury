# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.array(S.string).with(S.minLength, 2)
  input: "[string, string, ...string[]]"
  output: "[string, string, ...string[]]"
  instantiations: 1121
jsonSchema:
  input: '{ items: { type: "string" }, type: "array", minItems: 2 }'
  fromInputType: string[]
  output: '{ items: { type: "string" }, type: "array", minItems: 2 }'
  fromOutputType: string[]
isEqual: (a,b)=>{if(a===b)return true;let n=a.length;if(n!==b.length)return false;for(let i=0;i<n;i++)if(!(a[i]===b[i]))return false;return true}
compare: (a,b)=>{if(a===b)return 0;let n=a.length,m=b.length,l=n<m?n:m,c;for(let i=0;i<l;i++)if(c=a[i]<b[i]?-1:a[i]>b[i]?1:0)return c;return n<m?-1:n>m?1:0}
vs:
  zod:
    schema: z.array(z.string()).min(2)
    divergence: A literal lower bound fixes a head in the Sury type and leaves the tail open, so `S.minLength(2)` on an array admits `[string, string, ...string[]]` where Zod keeps the unbounded `string[]`.
    input: string[]
    output: string[]
operations:
  parse:
    expression: i=>{Array.isArray(i)||e[2](i);for(let v0=0;v0<i.length;++v0){let v1=i[v0];typeof v1==="string"||e[0](v1,[v0]);}i.length>1||e[1](i);return i}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      longer:
        input: '["a", "b", "c"]'
        output: '["a", "b", "c"]'
      shorter:
        input: '["a"]'
        error: Expected string[].length >= 2, received ["a"]
      empty:
        input: "[]"
        error: Expected string[].length >= 2, received []
      wrong-type:
        input: '"ab"'
        error: Expected string[].length >= 2, received "ab"
  decode:
    expression: i=>{i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      shorter:
        input: '["a"]'
        error: Expected string[].length >= 2, received ["a"]
      empty:
        input: "[]"
        error: Expected string[].length >= 2, received []
  encode:
    expression: i=>{i.length>1||e[0](i);return i}
    examples:
      at-the-length:
        input: '["a", "b"]'
        output: '["a", "b"]'
      shorter:
        input: '["a"]'
        error: Expected string[].length >= 2, received ["a"]
      empty:
        input: "[]"
        error: Expected string[].length >= 2, received []
