# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchemaOrThrow({ type: "number", minimum: 5, maximum: 1 })'
  input: never
  output: never
  instantiations: 796
jsonSchema:
  input: "{ not: {} }"
  output: "{ not: {} }"
isEqual: (a,b)=>a===b||e[0](a,b)
compare: "throws: [Sury] Can't compare never. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{e[0](i);return i}catch(v0){e[1](v0)}}
    examples:
      below-the-minimum:
        input: "1"
        error: Expected never, received 1
      above-the-maximum:
        input: "9"
        error: Expected never, received 9
      between-the-two-bounds:
        input: "3"
        error: Expected never, received 3
      wrong-type:
        input: '"3"'
        error: Expected never, received "3"
  decode: eq-to-parse
  encode: eq-to-parse
