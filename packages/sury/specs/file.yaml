# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.file
  input: File
  output: File
  instantiations: 266
jsonSchema:
  input: Expected JSON, received File
  output: Expected JSON, received File
vs:
  zod: z.file()
operations:
  parse:
    expression: i=>{i instanceof e[0]||e[1](i);return i}
    examples:
      valid:
        input: new File(["abc"], "a.txt")
        output: new File(["abc"], "a.txt")
      empty:
        input: new File([], "a.txt")
        output: new File([], "a.txt")
      blob-is-not-a-file:
        input: new Blob(["abc"])
        error: Expected File, received Blob
      string-is-not-a-file:
        input: '"abc"'
        error: Expected File, received "abc"
      null-is-not-a-file:
        input: "null"
        error: Expected File, received null
      object-is-not-a-file:
        input: "{}"
        error: Expected File, received {}
  decode: identity
  encode: identity
