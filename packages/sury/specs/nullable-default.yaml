# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.nullable(S.string, "bar")
  input: string | null
  output: string
  instantiations: 424
jsonSchema:
  input: '{ default: "bar", anyOf: [{ type: "null" }, { type: "string" }] }'
  output: '{ type: "string" }'
vs:
  zod: z.string().nullable().transform((value) => value ?? "bar")
operations:
  parse:
    expression: i=>{for(;;){if(i===null){i="bar";break}if(typeof i==="string")break;e[0](i)}return i}
    examples:
      string:
        input: '"foo"'
        output: '"foo"'
      null-becomes-the-default:
        input: "null"
        output: '"bar"'
      undefined-is-not-accepted:
        input: undefined
        error: Expected null | string, received undefined
  decode: eq-to-parse
  encode:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      string:
        input: '"foo"'
        output: '"foo"'
