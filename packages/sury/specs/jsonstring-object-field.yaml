    expression: i=>{return "{\"meta\":"+e[0](i["meta"])+",\"name\":"+e[0](i["name"])+"}"}
    examples:
      valid:
        input: '{ meta: "[1,null]", name: "a" }'
        output: '"{\"meta\":\"[1,null]\",\"name\":\"a\"}"'
  encode:
    expression: i=>{let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="object"&&v0&&!Array.isArray(v0)||e[4](v0);let v1=v0["meta"],v2=v0["name"];typeof v1==="string"||e[2](v1);try{JSON.parse(v1)}catch(t){e[1](v1)}typeof v2==="string"||e[3](v2);return {meta:v1,name:v2}}
    examples:
      valid:
        input: '"{\"meta\":\"{\\\"x\\\":1}\",\"name\":\"a\"}"'
        output: '{ meta: "{\"x\":1}", name: "a" }'
      raw-object-at-json-string-position:
        input: '"{\"meta\":{\"x\":1},\"name\":\"a\"}"'
        error: "Failed at meta: Expected JSON string, received { x: 1; }"
