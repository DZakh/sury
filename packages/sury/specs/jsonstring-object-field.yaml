ts:
  schema: "S.schema({meta: S.jsonString, name: S.string}).with(S.to, S.jsonString)"
  input: "{ meta: string; name: string; }"
  output: string
  instantiations: 5135
jsonSchema:
  input: '{ type: "object", properties: { meta: { type: "string", contentMediaType: "application/json" }, name: { type: "string" } }, required: ["meta", "name"] }'
  output: '{ type: "string", contentMediaType: "application/json" }'
  draft-2020-12:
    output: '{ type: "string", contentMediaType: "application/json", contentSchema: { type: "object", properties: { meta: { type: "string", contentMediaType: "application/json" }, name: { type: "string" } }, required: ["meta", "name"] }, $schema: "https://json-schema.org/draft/2020-12/schema" }'
  openapi-3.0:
    input: '{ type: "object", properties: { meta: { type: "string" }, name: { type: "string" } }, required: ["meta", "name"] }'
