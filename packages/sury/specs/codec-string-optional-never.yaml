      string:
        input: '"abc"'
        output: '"abc"'
      undefined-string-stays-string:
        input: '"undefined"'
        output: '"undefined"'
  decode: identity
  encode:
    expression: i=>{for(;;){if(typeof i==="string")break;if(i===void 0){e[0](i);break}e[1](i)}return i}
