# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.union([S.string, S.number]).with(S.to, S.union([S.number, S.string, S.boolean]))
  input: string | number
  output: string | number | boolean
  instantiations: 7342
  bundleBytes: 10538
jsonSchema:
  input: '{ anyOf: [{ type: "number" }, { type: "string" }] }'
  output: '{ anyOf: [{ type: "string" }, { type: "number" }] }'
operations:
  parse:
    expression: i=>{if(!(typeof i==="string"||typeof i==="number"&&!Number.isNaN(i))){e[0](i)}return i}
    examples:
      string-passes-through:
        input: '"hello"'
        output: '"hello"'
      number-passes-through:
        input: "42"
        output: "42"
      boolean-is-not-a-source-case:
        input: "true"
        error: Expected string | number, received true
  decode: eq-to-parse
  encode:
    expression: i=>{if(typeof i==="boolean"){e[1](i,e[0])}else if(!(typeof i==="number"&&!Number.isNaN(i)||typeof i==="string")){e[2](i)}return i}
    examples:
      number-passes-back:
        input: "42"
        output: "42"
      string-passes-back:
        input: '"hello"'
        output: '"hello"'
      boolean-has-no-free-source-target:
        input: "true"
        error: |-
          Expected number | string | boolean, received true
          - Can't decode boolean to string | number. Use S.to to define a custom decoder
