# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.length, 2)
  input: string
  output: string
  instantiations: 807
jsonSchema:
  input: '{ type: "string", minLength: 2, maxLength: 2 }'
  output: '{ type: "string", minLength: 2, maxLength: 2 }'
isEqual: strictEqual
vs:
  zod: z.string().length(2)
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);i.length===2||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      two-emojis:
        input: '"😀😀"'
        error: Expected string.length == 2, received "😀😀"
      emoji:
        input: '"😀"'
        output: '"😀"'
        divergence:
          reason: minLength counts code points and S.length counts JS characters, so the emoji is one short of the document's bound
          ajv: "input: data must NOT have fewer than 2 characters; output: data must NOT have fewer than 2 characters"
      zwj-sequence:
        input: '"👨‍👩"'
        error: Expected string.length == 2, received "👨‍👩"
      longer:
        input: '"abc"'
        error: Expected string.length == 2, received "abc"
      shorter:
        input: '"a"'
        error: Expected string.length == 2, received "a"
      empty:
        input: '""'
        error: Expected string.length == 2, received ""
      single-space:
        input: '" "'
        error: Expected string.length == 2, received " "
      wrong-type:
        input: "1"
        error: Expected string.length == 2, received 1
  decode:
    expression: i=>{i.length===2||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      two-emojis:
        input: '"😀😀"'
        error: Expected string.length == 2, received "😀😀"
      emoji:
        input: '"😀"'
        output: '"😀"'
      zwj-sequence:
        input: '"👨‍👩"'
        error: Expected string.length == 2, received "👨‍👩"
      shorter:
        input: '"a"'
        error: Expected string.length == 2, received "a"
      empty:
        input: '""'
        error: Expected string.length == 2, received ""
  encode:
    expression: i=>{i.length===2||e[0](i);return i}
    examples:
      at-the-length:
        input: '"ab"'
        output: '"ab"'
      two-emojis:
        input: '"😀😀"'
        error: Expected string.length == 2, received "😀😀"
      emoji:
        input: '"😀"'
        output: '"😀"'
      zwj-sequence:
        input: '"👨‍👩"'
        error: Expected string.length == 2, received "👨‍👩"
      shorter:
        input: '"a"'
        error: Expected string.length == 2, received "a"
      empty:
        input: '""'
        error: Expected string.length == 2, received ""
