ts:
  schema: 'S.fromJSONSchema({ type: "string", pattern: "^\\a$" })'
  input: string
  output: string
  instantiations: 508
jsonSchema:
  input: '{ type: "string", pattern: "^\\a$" }'
  output: '{ type: "string", pattern: "^\\a$" }'
