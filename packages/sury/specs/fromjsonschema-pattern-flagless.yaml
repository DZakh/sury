operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);e[0].test(i)||e[1](i);return i}
    examples:
      flagless-identity-escape:
        input: '"a"'
        output: '"a"'
      wrong-value:
        input: '"b"'
        error: Invalid pattern
  decode:
    expression: i=>{e[0].test(i)||e[1](i);return i}
    examples:
      flagless-identity-escape:
        input: '"a"'
        output: '"a"'
  encode:
    expression: i=>{e[0].test(i)||e[1](i);return i}
