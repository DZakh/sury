# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.nullish(S.string).with(S.to, S.string)
  input: string | null | undefined
  output: string
  instantiations: 4659
jsonSchema:
  input: '{ type: "string" }'
  fromInputType: string
  output: '{ type: "string" }'
isEqual: strictEqual
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[0](i);return i}
    examples:
      string:
        input: '"abc"'
        output: '"abc"'
      undefined-is-rejected:
        input: undefined
        error: Expected string, received undefined
      null-is-rejected:
        input: "null"
        error: Expected string, received null
  decode: eq-to-parse
  encode: identity
