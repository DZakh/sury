# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.record(S.string).with(S.to, S.schema({ a: S.optional(S.string, "d"), b: S.union([S.optional(S.string, "e"), S.boolean]) }))'
  input: "{ [x: string]: string; }"
  output: "{ a: string; b: string | boolean; }"
  instantiations: 6774
jsonSchema:
  input: '{ type: "object", additionalProperties: { type: "string" } }'
  output: '{ type: "object", properties: { a: { type: "string" }, b: { anyOf: [{ type: "string" }, { type: "boolean" }] } }, required: ["a", "b"] }'
isEqual:
  input: (a,b)=>{if(a===b)return true;let n=0;for(const k in a){if(!(k in b)||!(a[k]===b[k]))return false;n++}for(const k in b)n--;return !n}
  output: (a,b)=>a===b||a.a===b.a&&a.b===b.b
compare:
  input: "throws: [Sury] Can't compare { [key: string]: string; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
  output: "throws: [Sury] Can't compare { a: string; b: string | boolean; }. Only primitives, Date, URL and tuples of them are orderable. Use isEqual for equality"
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{try{typeof i==="object"&&i&&!Array.isArray(i)||e[1](i);for(let v0 in i){let v1=i[v0];typeof v1==="string"||e[0](v1,[v0]);}let v2=i.a,v3=i.b;return {a:v2,b:v3}}catch(v4){e[2](v4)}}
    examples:
      # FIXME: a missing key skips the field's default
      missing:
        input: "{}"
        output: "{ a: undefined, b: undefined }"
      present:
        input: '{ a: "x", b: "y" }'
        output: '{ a: "x", b: "y" }'
  decode:
    expression: i=>{let v1=i.a,v2=i.b;return {a:v1,b:v2}}
    examples:
      # FIXME: a missing key skips the field's default
      missing:
        input: "{}"
        output: "{ a: undefined, b: undefined }"
      present:
        input: '{ a: "x", b: "y" }'
        output: '{ a: "x", b: "y" }'
  encode:
    creationError: "SuryError: Failed at b: Ambiguous string | boolean -> string. Should boolean be decoded or ignored? Choose with S.to for boolean -> string, or S.never -> boolean"
