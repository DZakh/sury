# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.schema(NaN).with(S.to, S.union([S.schema(NaN), S.string]))
  input: number
  output: string | number
  instantiations: 5512
jsonSchema:
  input: Expected JSON, received NaN
  output: Expected JSON, received NaN | string
isEqual:
  input: alwaysEqual
  output: (a,b)=>a===b||(a!=a?b!=b:typeof b==="string"&&a===b)
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{Number.isNaN(i)||e[0](i);i=NaN;return i}
    examples:
      nan:
        input: NaN
        output: NaN
      other-number:
        input: "1"
        error: Expected NaN, received 1
  decode: eq-to-parse
  encode:
    creationError: "SuryError: Ambiguous NaN | string -> NaN. Should string be decoded or ignored? Choose with S.to for string -> NaN, or S.never -> string"
