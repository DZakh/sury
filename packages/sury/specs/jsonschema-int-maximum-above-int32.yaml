# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: 'S.fromJSONSchema({ type: "integer", maximum: 3000000000 })'
  input: number
  output: number
  instantiations: 387
vs:
  zod:
    _skip: not-applicable
jsonSchema:
  input: '{ type: "integer", maximum: 3000000000 }'
  output: '{ type: "integer", maximum: 3000000000 }'
operations:
  parse:
    expression: i=>{typeof i==="number"&&i%1===0||e[1](i);i<=3000000000||e[0](i);return i}
    examples:
      well-inside:
        input: "5"
        output: "5"
      below-int32:
        input: "-3000000000"
        output: "-3000000000"
      between-int32-and-the-documented-maximum:
        input: "2500000000"
        output: "2500000000"
      at-the-documented-maximum:
        input: "3000000000"
        output: "3000000000"
      above-the-documented-maximum:
        input: "4000000000"
        error: Expected integer <= 3000000000, received 4000000000
      non-integer:
        input: "5.5"
        error: Expected integer <= 3000000000, received 5.5
  decode:
    expression: i=>{i<=3000000000||e[0](i);return i}
    examples:
      at-the-documented-maximum:
        input: "3000000000"
        output: "3000000000"
      above-the-documented-maximum:
        input: "4000000000"
        error: Expected integer <= 3000000000, received 4000000000
  encode:
    expression: i=>{i<=3000000000||e[0](i);return i}
    examples:
      at-the-documented-maximum:
        input: "3000000000"
        output: "3000000000"
      above-the-documented-maximum:
        input: "4000000000"
        error: Expected integer <= 3000000000, received 4000000000
