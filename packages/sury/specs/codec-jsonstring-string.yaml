# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.jsonString.with(S.to, S.string)
  input: string
  output: string
  instantiations: 4494
jsonSchema:
  input: '{ type: "string", contentMediaType: "application/json" }'
  output: '{ type: "string" }'
  draft-2020-12:
    input: '{ type: "string", contentMediaType: "application/json", contentSchema: { type: "string" }, $schema: "https://json-schema.org/draft/2020-12/schema" }'
  openapi-3.0:
    input: '{ type: "string" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="string"||e[1](v0);return v0}
    examples:
      parses-the-document:
        input: '"\"abc\""'
        output: '"abc"'
      bare-text-is-not-a-document:
        input: '"abc"'
        error: Expected JSON string, received "abc"
      number-is-not-a-string:
        input: '"42"'
        error: Expected string, received 42
  decode:
    expression: i=>{let v0;try{v0=JSON.parse(i)}catch(t){e[0](i)}typeof v0==="string"||e[1](v0);return v0}
    examples:
      parses-the-document:
        input: '"\"abc\""'
        output: '"abc"'
  encode:
    expression: i=>{return e[0](i)}
    examples:
      escapes:
        input: '"say \"hi\""'
        output: '"\"say \\\"hi\\\"\""'
