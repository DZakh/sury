ts:
  schema: S.number.with(S.gte, 5, "A").with(S.gte, 10)
  input: number
  output: number
  instantiations: 5342
vs:
  zod: z.number().gte(5, "A").gte(10)
jsonSchema:
  input: '{ type: "number", minimum: 10 }'
  output: '{ type: "number", minimum: 10 }'
operations:
  parse:
    expression: i=>{typeof i==="number"&&!Number.isNaN(i)||e[1](i);i>=10||e[0](i);return i}
    examples:
      at-the-surviving-bound:
        input: "10"
        output: "10"
      below-the-replaced-bound:
        input: "3"
        error: Expected number >= 10, received 3
      between-the-two-bounds:
        input: "7"
        error: Expected number >= 10, received 7
  decode:
    expression: i=>{i>=10||e[0](i);return i}
    examples:
      at-the-surviving-bound:
        input: "10"
        output: "10"
      between-the-two-bounds:
        input: "7"
        error: Expected number >= 10, received 7
  encode:
    expression: i=>{i>=10||e[0](i);return i}
    examples:
      at-the-surviving-bound:
        input: "10"
        output: "10"
      between-the-two-bounds:
        input: "7"
        error: Expected number >= 10, received 7
