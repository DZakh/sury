      invalid-leap-second-negative-time-offset-wrong-minute:
        input: '"23:59:60-00:30"'
        error: Expected time, received "23:59:60-00:30"
      a-valid-time-string-with-second-fraction:
        input: '"23:20:50.52Z"'
        output: '"23:20:50.52Z"'
      a-valid-time-string-with-precise-second-fraction:
        input: '"08:30:06.283185Z"'
        output: '"08:30:06.283185Z"'
      a-valid-time-string-with-plus-offset:
        input: '"08:30:06+00:20"'
        output: '"08:30:06+00:20"'
      a-valid-time-string-with-minus-offset:
        input: '"08:30:06-08:00"'
        output: '"08:30:06-08:00"'
      time-with-unknown-local-offset-is-valid:
        input: '"12:34:56-00:00"'
        output: '"12:34:56-00:00"'
      hour-minute-in-time-offset-must-be-two:
