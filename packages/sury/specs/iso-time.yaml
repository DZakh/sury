      a-valid-time-string-with-case-insensitive-z:
        input: '"08:30:06z"'
        output: '"08:30:06z"'
      an-invalid-time-string-with-invalid-hour:
        input: '"24:00:00Z"'
        error: Expected time, received "24:00:00Z"
      an-invalid-time-string-with-invalid-minute:
        input: '"00:60:00Z"'
        error: Expected time, received "00:60:00Z"
      an-invalid-time-string-with-invalid-second:
        input: '"00:00:61Z"'
        error: Expected time, received "00:00:61Z"
      an-invalid-time-string-with-invalid-leap-second:
        input: '"22:59:60Z"'
        error: Expected time, received "22:59:60Z"
      an-invalid-time-string-with-invalid-leap-second-2:
        input: '"23:58:60Z"'
        error: Expected time, received "23:58:60Z"
