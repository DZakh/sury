        error: Expected time, received "22:59:60+00:00"
      invalid-leap-second-zero-time-offset-wrong-minute:
        input: '"23:58:60+00:00"'
        error: Expected time, received "23:58:60+00:00"
      valid-leap-second-positive-time-offset:
        input: '"01:29:60+01:30"'
        output: '"01:29:60+01:30"'
      valid-leap-second-large-positive-time-offset:
        input: '"23:29:60+23:30"'
        output: '"23:29:60+23:30"'
      invalid-leap-second-positive-time-offset-wrong-hour:
        input: '"23:59:60+01:00"'
        error: Expected time, received "23:59:60+01:00"
      invalid-leap-second-positive-time-offset-wrong-minute:
        input: '"23:59:60+00:30"'
        error: Expected time, received "23:59:60+00:30"
      valid-leap-second-negative-time-offset:
        input: '"15:59:60-08:00"'
