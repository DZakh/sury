        input: '"01:02:03+00:60"'
        error: Expected time, received "01:02:03+00:60"
      an-invalid-time-string-with-invalid-time-with:
        input: '"01:02:03Z+00:30"'
        error: Expected time, received "01:02:03Z+00:30"
      an-invalid-offset-indicator:
        input: '"08:30:06 PST"'
        error: Expected time, received "08:30:06 PST"
      only-rfc3339-not-all-of-iso-8601-are:
        input: '"01:01:01,1111"'
        error: Expected time, received "01:01:01,1111"
      no-time-offset:
        input: '"12:00:00"'
        error: Expected time, received "12:00:00"
      no-time-offset-with-second-fraction:
        input: '"12:00:00.52"'
        error: Expected time, received "12:00:00.52"
      invalid-non-ascii-a-bengali-2:
        input: '"1২:00:00Z"'
        error: Expected time, received "1২:00:00Z"
      offset-not-starting-with-plus-or-minus:
        input: '"08:30:06#00:20"'
        error: Expected time, received "08:30:06#00:20"
      contains-letters:
        input: '"ab:cd:ef"'
        error: Expected time, received "ab:cd:ef"
      an-invalid-time-string-in-date-time-format:
        input: '"2020-11-28T23:55:45Z"'
        error: Expected time, received "2020-11-28T23:55:45Z"
  decode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      valid:
        input: '"08:30:06Z"'
        output: '"08:30:06Z"'
      invalid:
        input: '"008:030:006Z"'
        error: Expected time, received "008:030:006Z"
  encode:
    expression: i=>{e[0](i)||e[1](i);return i}
    examples:
      valid:
        input: '"08:30:06Z"'
        output: '"08:30:06Z"'
      invalid:
        input: '"008:030:006Z"'
        error: Expected time, received "008:030:006Z"
