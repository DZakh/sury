# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.isoTime
  input: string
  output: string
  instantiations: 254
vs:
  zod: z.iso.time()
jsonSchema:
  input: '{ type: "string", format: "time" }'
  output: '{ type: "string", format: "time" }'
operations:
  parse:
    expression: i=>{typeof i==="string"||e[2](i);e[0](i)||e[1](i);return i}
    examples:
      a-valid-time-string:
        input: '"08:30:06Z"'
        output: '"08:30:06Z"'
      invalid-time-string-with-extra-leading-zeros:
        input: '"008:030:006Z"'
        error: Expected time, received "008:030:006Z"
      invalid-time-string-with-no-leading-zero-for:
        input: '"8:3:6Z"'
        error: Expected time, received "8:3:6Z"
      hour-minute-second-must-be-two-digits:
        input: '"8:0030:6Z"'
        error: Expected time, received "8:0030:6Z"
      a-valid-time-string-with-leap-second-zulu:
        input: '"23:59:60Z"'
        output: '"23:59:60Z"'
      invalid-leap-second-zulu-wrong-hour:
        input: '"22:59:60Z"'
        error: Expected time, received "22:59:60Z"
      invalid-leap-second-zulu-wrong-minute:
        input: '"23:58:60Z"'
        error: Expected time, received "23:58:60Z"
