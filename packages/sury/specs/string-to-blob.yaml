# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.blob)
  input: string
  output: Blob
  instantiations: 5244
jsonSchema:
  input: '{ type: "string", contentMediaType: "application/octet-stream" }'
  output: Expected JSON, received Blob
  openapi-3.0:
    input: '{ type: "string", format: "binary" }'
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);return new e[0]([i])}
    examples:
      not-a-string:
        input: "42"
        error: Expected string, received 42
  decode:
    expression: i=>{return new e[0]([i])}
    examples:
      not-a-part:
        input: '{ toString: () => { throw new Error("boom") } }'
        error: boom
  encode:
    isAsync: true
    expression: i=>{let v0;try{v0=i.text().catch(e[0])}catch(x){e[0](x)}return v0}
    examples:
      reads-the-text:
        input: new Blob(["hi"])
        output: '"hi"'
