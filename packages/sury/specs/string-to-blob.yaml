# yaml-language-server: $schema=./spec.schema.json
ts:
  schema: S.string.with(S.to, S.blob)
  input: string
  output: Blob
  instantiations: 5244
jsonSchema:
  input: '{ type: "string", contentMediaType: "application/octet-stream" }'
  output: Expected JSON, received Blob
vs:
  zod:
    _skip: not-applicable
operations:
  parse:
    expression: i=>{typeof i==="string"||e[1](i);return new e[0]([i])}
    examples:
      text-becomes-a-blob:
        input: '"hi"'
        error: cannot represent a Blob instance as spec source code
  decode:
    expression: i=>{return new e[0]([i])}
    examples:
      text-becomes-a-blob:
        input: '"hi"'
        error: cannot represent a Blob instance as spec source code
  encode:
    isAsync: true
    expression: i=>{let v0=i.text();return v0}
    examples:
      reads-the-text:
        input: new Blob(["hi"])
        output: '"hi"'
