name: CI

on:
  push:
    branches:
      - main
      - "v\\d+.\\d+.\\d+-patch"
  pull_request:
  # Lets CodSpeed trigger backtest runs to seed initial baseline data.
  workflow_dispatch:

jobs:
  sury:
    name: Sury - Build & Test & Pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      - run: pnpm lint:deadcode

      - run: pnpm build
        working-directory: packages/sury

      - run: pnpm coverage
        working-directory: packages/sury

      - uses: codecov/codecov-action@v7
        with:
          files: packages/sury/coverage/lcov.info

      # Doesn't work with rescript v12
      # - run: pnpm lint:stdlib
      #   working-directory: packages/sury

      - uses: actions/upload-artifact@v4
        with:
          name: sury
          path: packages/sury/artifacts

  compliance:
    name: JSON Schema Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      # Fetches the pinned upstream revision (see suite-ref.json) and fails if
      # the score drifts from packages/json-schema-test-suite/goldens/ in
      # either direction — a fix that improves coverage is expected to land the
      # regenerated golden alongside it.
      - name: Restore suite checkout
        uses: actions/cache@v4
        with:
          path: packages/json-schema-test-suite/.suite
          key: json-schema-test-suite-${{ hashFiles('packages/json-schema-test-suite/suite-ref.json') }}

      - run: pnpm compliance

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      # Runs the Vitest runtime benchmarks under CodSpeed instrumentation
      # (deterministic instruction counts). Posts a per-benchmark delta comment
      # on PRs; regression gating is configured in the CodSpeed dashboard.
      # Auth is tokenless via OIDC (see the permissions block above).
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          run: pnpm --filter=sury bench && pnpm --filter=e2e benchmark:comparison

  wallclock-benchmarks:
    name: Wall-clock Benchmarks (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: wallclock-benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The spec performance step below builds its baseline from the PR's
          # base branch, which a shallow checkout doesn't have.
          fetch-depth: 0
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      # Every spec measured against the same library built from the PR's base
      # branch — schema creation, creation+compilation, and each example. Both
      # versions run interleaved in one process, so a shared runner's noise hits
      # them equally and cancels in the ratio. First, for the cleanest runner
      # state. Advisory: a regression never fails the job (a failed
      # *measurement* still does).
      - name: Spec performance
        # For pipefail: the default `bash -e` would let `tee` mask a failure.
        shell: bash
        run: pnpm --filter=sury spec check --perf=only | tee spec-perf.txt

      - uses: actions/upload-artifact@v4
        id: spec-perf-artifact
        with:
          name: spec-perf
          path: spec-perf.txt

      - name: Format spec performance comment
        run: npx tsx packages/spec/perfComment.ts spec-perf.txt spec-perf-comment.md
        env:
          ARTIFACT_URL: ${{ steps.spec-perf-artifact.outputs.artifact-url }}

      - name: Post/update spec performance comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          BODY_FILE: spec-perf-comment.md
          MARKER: "<!-- spec-perf -->"
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(process.env.BODY_FILE, "utf8");
            const marker = process.env.MARKER;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );
            const args = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) await github.rest.issues.updateComment({ ...args, comment_id: existing.id });
            else await github.rest.issues.createComment({ ...args, issue_number: context.issue.number });

      # Plain `vitest bench` run (no CodSpeed instrumentation) — real
      # wall-clock ops/sec, reported separately from the simulated instruction
      # counts in the `benchmarks` job above.
      - name: Run comparison benchmark
        run: pnpm --filter=e2e benchmark:comparison:report

      - name: Format PR comment
        run: npx tsx packages/e2e/scripts/format-wallclock-comment.ts packages/e2e/bench-results.json bench-comment.md

      # Forks get a read-only GITHUB_TOKEN on `pull_request`, so posting a
      # comment would 403 — skip it there rather than failing the job.
      - name: Post/update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("bench-comment.md", "utf8");
            const marker = "<!-- wallclock-bench-comment -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  ppx-build-linux:
    name: ppx-build-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build --profile static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-linux
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  ppx-build-linux-arm:
    name: ppx-build-linux-arm
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build --profile static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-linux-arm
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  ppx-build-macos:
    name: ppx-build-macos
    runs-on: macOS-latest
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-macos
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  ppx-build-windows:
    name: ppx-build-windows
    runs-on: windows-2025
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-windows
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  pack-sury-ppx:
    name: Pack sury-ppx
    needs: [ppx-build-linux, ppx-build-linux-arm, ppx-build-macos, ppx-build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      - name: Download ppx linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ppx-build-linux
          path: binaries/linux

      - name: Download ppx linux-ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ppx-build-linux-arm
          path: binaries/linux-arm

      - name: Download macOS artifacts
        uses: actions/download-artifact@master
        with:
          name: ppx-build-macos
          path: binaries/macos

      - name: Download windows artifacts
        uses: actions/download-artifact@master
        with:
          name: ppx-build-windows
          path: binaries/windows

      - name: Move ppx artifacts
        run: |
          mv binaries/linux/bin.exe packages/sury-ppx/ppx-linux.exe
          mv binaries/linux-arm/bin.exe packages/sury-ppx/ppx-linux-arm.exe
          mv binaries/macos/bin.exe packages/sury-ppx/ppx-osx.exe
          mv binaries/windows/bin.exe packages/sury-ppx/ppx-windows.exe

      - name: npm pack (sury-ppx)
        run: npm pack
        working-directory: packages/sury-ppx

      - name: "Upload artifact: sury-ppx npm package"
        uses: actions/upload-artifact@v4
        with:
          name: sury-ppx
          path: packages/sury-ppx/sury-ppx-*.tgz

  e2e:
    name: E2E Test
    needs: [ppx-build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      - name: Download ppx linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ppx-build-linux
          path: binaries/linux

      - name: Move ppx artifacts
        run: |
          mv binaries/linux/bin.exe packages/sury-ppx/ppx-linux.exe

      - name: Install ppx
        run: pnpm ppx:install
        working-directory: packages/e2e

      - run: pnpm rescript && pnpm test
        working-directory: packages/e2e
