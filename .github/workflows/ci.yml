name: CI

on:
  push:
    branches:
      - main
      - "v\\d+.\\d+.\\d+-patch"
  pull_request:
  # Allow manual runs.
  workflow_dispatch:

jobs:
  sury:
    name: Sury - Build & Test & Pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: "pnpm"
      - run: pnpm install

      - run: pnpm lint:deadcode

      - run: pnpm build
        working-directory: packages/sury

      - run: pnpm coverage
        working-directory: packages/sury

      - uses: codecov/codecov-action@v7
        with:
          files: packages/sury/coverage/lcov.info

      # Doesn't work with rescript v12
      # - run: pnpm lint:stdlib
      #   working-directory: packages/sury

      - uses: actions/upload-artifact@v4
        with:
          name: sury
          path: packages/sury/artifacts

  perf:
    name: Perf goldens
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: "pnpm"

      # Perf goldens are retired-instruction counts measured under Valgrind
      # (see packages/spec/perf.ts). They're exact for a fixed Node/V8 build, so
      # this job MUST use the same node-version the goldens were baselined on
      # (22.22.2, above) — a different Node shifts every count. `pnpm install`
      # builds the native callgrind addon via the spec package's postinstall.
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: pnpm install

      # `pnpm install` already builds the addon via the spec package's
      # postinstall; this is an explicit guard so a skipped script can't
      # silently turn the perf gate into a no-op (a missing addon makes
      # `spec check` print `perf: skipped` and pass without gating).
      - run: pnpm --filter=spec build:native

      # The perf worker imports the in-development bundle, same as the rest of
      # `spec check`'s golden recomputation.
      - run: pnpm --filter=sury build:entry

      # Read-only gate: recomputes every golden (codegen, bundle, types) AND
      # re-measures createPerf/compilePerf, failing on drift beyond the ±10%
      # cross-machine band (see perf.ts; a GC-polluted region is retried).
      - run: pnpm --filter=spec spec check

  wallclock-benchmarks:
    name: Wall-clock Benchmarks (comparison)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: wallclock-benchmarks-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          cache: "pnpm"
      - run: pnpm install

      # Plain `vitest bench` run — real wall-clock ops/sec for human "feel"
      # and cross-library positioning, separate from the deterministic
      # instruction-count perf goldens gated by the `perf` job above.
      - name: Run comparison benchmark
        run: pnpm --filter=e2e benchmark:comparison:report

      - name: Format PR comment
        run: npx tsx packages/e2e/scripts/format-wallclock-comment.ts packages/e2e/bench-results.json bench-comment.md

      # Forks get a read-only GITHUB_TOKEN on `pull_request`, so posting a
      # comment would 403 — skip it there rather than failing the job.
      - name: Post/update PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("bench-comment.md", "utf8");
            const marker = "<!-- wallclock-bench-comment -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  ppx-build-linux:
    name: ppx-build-linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build --profile static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-linux
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  ppx-build-linux-arm:
    name: ppx-build-linux-arm
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build --profile static

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-linux-arm
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  ppx-build-macos:
    name: ppx-build-macos
    runs-on: macOS-latest
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-macos
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  ppx-build-windows:
    name: ppx-build-windows
    runs-on: windows-2025
    defaults:
      run:
        working-directory: packages/sury-ppx/src
    strategy:
      matrix:
        ocaml-compiler:
          - 5.3.0
    steps:
      - uses: actions/checkout@v4

      - name: Use OCaml ${{ matrix.ocaml-compiler}}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install deps
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppx-build-windows
          path: packages/sury-ppx/src/_build/default/bin/bin.exe
          if-no-files-found: error

  pack-sury-ppx:
    name: Pack sury-ppx
    needs: [ppx-build-linux, ppx-build-linux-arm, ppx-build-macos, ppx-build-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: "pnpm"
      - run: pnpm install

      - name: Download ppx linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ppx-build-linux
          path: binaries/linux

      - name: Download ppx linux-ARM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ppx-build-linux-arm
          path: binaries/linux-arm

      - name: Download macOS artifacts
        uses: actions/download-artifact@master
        with:
          name: ppx-build-macos
          path: binaries/macos

      - name: Download windows artifacts
        uses: actions/download-artifact@master
        with:
          name: ppx-build-windows
          path: binaries/windows

      - name: Move ppx artifacts
        run: |
          mv binaries/linux/bin.exe packages/sury-ppx/ppx-linux.exe
          mv binaries/linux-arm/bin.exe packages/sury-ppx/ppx-linux-arm.exe
          mv binaries/macos/bin.exe packages/sury-ppx/ppx-osx.exe
          mv binaries/windows/bin.exe packages/sury-ppx/ppx-windows.exe

      - name: npm pack (sury-ppx)
        run: npm pack
        working-directory: packages/sury-ppx

      - name: "Upload artifact: sury-ppx npm package"
        uses: actions/upload-artifact@v4
        with:
          name: sury-ppx
          path: packages/sury-ppx/sury-ppx-*.tgz

  e2e:
    name: E2E Test
    needs: [ppx-build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: "pnpm"
      - run: pnpm install

      - name: Download ppx linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: ppx-build-linux
          path: binaries/linux

      - name: Move ppx artifacts
        run: |
          mv binaries/linux/bin.exe packages/sury-ppx/ppx-linux.exe

      - name: Install ppx
        run: pnpm ppx:install
        working-directory: packages/e2e

      - run: pnpm rescript && pnpm test
        working-directory: packages/e2e
